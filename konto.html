     Gemeinsamer Schluessel "levita-theme" (gleiche Herkunft app.le-vita.com). */
  (function () { try { var t = localStorage.getItem('levita-theme');
    if (t === 'hell' || t === 'dunkel') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();

<!--
  Mein Bereich — persönliches Konto (LeVITA Vital-Check)

  17.10.2026 (zu Vital-Check v2.8.15, konto.js 1.4.0): Hell/Dunkel. Vollstaendiger
  Token-Satz und helle Bloecke woertlich aus dem Vital-Check; Umschalter (Sonne/Mond)
  in der Kopfzeile, gemeinsamer Speicherschluessel levita-theme. Akzentfarben als
  Schrift ueber --accent-*-text. Sichtbar auf Dunkel: --text-muted #4a6280 -> #8396ae
  (stand bei 2,9:1, wie im Vital-Check seit v2.8.6) und Knopfschrift #062214/#2a0606
  -> --on-accent (#0a1628). Druckstil und Entwickleransichten bleiben unveraendert.
  Liegt neben index.html des Checks (app.logivita.de/check/) und nutzt dessen
  assets/ (Schriften, konto.js). Hierher führt der Link aus der Konto-Mail.
  Absichtlich eine eigene Seite und KEIN Teil des eingebetteten Checks: Im
  iFrame auf le-vita.com wäre der Speicher fremder Herkunft, Safari würde die
  Anmeldung dort verwerfen.

  Ablauf:
    Landung nach dem Mail-Link → Durchsicht ("Gehört dieser Check zu dir?")
    → Übersicht: Checks mit Verlauf, E-Mail-Einstellungen, Abmelden, Löschen.
    Ohne Sitzung: Anmeldelink per Mail anfordern.

  Studio: ?studio=<slug>, ohne Angabe LeVITA.
  Testmodus: ?internal=1 zeigt die letzte Server-Antwort.

  Versionen:
  1.5.0 (19.10.2026) Paket G: Modulkarte liest module_access aus my_checks (SQL 07) — dieselbe Zugangsregel wie
  Vital-Check-Seite, Mail und Modul-Eingänge (ärztlicher Vorrang, Essverhalten, BMI-Grenzen des Ernährungs-Checks).
  1.4.0 (18.10.2026) Umsetzungsfassung Systemtest (Regelversion 2026-10-R1): Liste der Checks liest den
        Hinweisstatus aus my_checks (SQL 06) — bei Status keine Stufe und kein Vitalitäts-Alter (S1/V4), sonst
        Alter nie unter 18 und als experimentelle Umrechnung gekennzeichnet (V1–V3). Neue Karte "Deine
        Zusatzmodule" zum neuesten Check (W1): Ernährungs-Check, Versorgungs-Check (abgeschlossen/verfügbar),
        bei ärztlichem Vorrang "Zuerst ärztlich abklären" ohne Knopf. Ohne SQL 06 bleibt alles wie bisher.
  1.3.0 (15.10.2026) Hinweise zum Anmeldelink: Anmeldeseite mit "So funktioniert die Anmeldung",
        nach dem Versand Gültigkeit und Gerätetipp, verständlichere Seite bei abgelaufenem Link,
        einmaliges Erklärfenster bei der Einrichtung (erste Anmeldung auf einem Gerät), Karte
        "Anmeldung und Sicherheit" in der Übersicht. Texte für die Einführungsphase des
        Ernährungs-Checks (Konto freiwillig, keine Begleitung). Lädt konto.js 1.3.0.
  1.2.0 (14.10.2026) "Ergebnis ansehen" je Check und "Neuen Vital-Check starten" (als Re-Check mit dem
        letzten Check verknüpft) — beides ohne PIN über das Login; gehört zu Check v2.8.0 und Edge
        submit-vital-check edge-2026-10-14.3
  1.1.0 (13.10.2026) Schalter "Mein Plan per E-Mail" entfällt (Entscheidung Jörg: die Plan-Mail fordert
        der Nutzer selbst an, Knopf kommt mit dem Plan); lädt konto.js 1.1.0 — gehört zu Edge
        account-edge-2026-10-13.3 (EDGE_account_1.2.0.ts)
  1.0.0 (13.10.2026) erste Fassung — gehört zu Edge account-edge-2026-10-13.2
        (EDGE_account_1.1.0.ts), konto-fundament_1.2.0.sql, assets/konto.js 1.0.0
-->

  /* Umschalter (wie im Vital-Check) */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--brand-dark); color: var(--text-primary); min-height: 100vh; padding: 20px 16px 60px; line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 24px; }
  .logo-sub { font-size: 12px; color: var(--text-secondary); letter-spacing: .04em; text-transform: uppercase; }
  .hdr-btn { background: transparent; border: 1px solid var(--border-hover); color: var(--text-secondary); border-radius: 999px; padding: 6px 14px; font: 600 12px 'DM Sans', sans-serif; cursor: pointer; }

  h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  p.lead { color: var(--text-secondary); font-size: 16px; margin-bottom: 22px; }
  .muted { color: var(--text-secondary); font-size: 14px; }
  .small { font-size: 13px; color: var(--text-muted); }

  .card { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
  .card.warn { border-color: rgba(var(--accent-amber-rgb),.45); background: rgba(var(--accent-amber-rgb),.08); }
  .card.ok { border-color: rgba(var(--accent-green-rgb),.45); background: linear-gradient(180deg, rgba(var(--accent-green-rgb),.10), var(--brand-card) 55%); }
  .card.danger { border-color: rgba(var(--accent-red-rgb),.35); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  input[type=email], input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: rgba(var(--ink-rgb),.04); color: var(--text-primary); font: 500 15px 'DM Sans', sans-serif; -webkit-appearance: none; }
  input:focus { outline: none; border-color: var(--accent-green); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 22px; border-radius: 999px; border: 0;
    background: var(--accent-green); color: var(--on-accent); font: 700 15px 'DM Sans', sans-serif; cursor: pointer; transition: transform .12s, opacity .12s; text-decoration: none; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-hover); }
  .btn.red { background: var(--accent-red); color: var(--on-accent); }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .btn { flex: 1; }
  .error { color: var(--accent-red-text); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .note { font-size: 14px; color: var(--text-secondary); margin-top: 10px; }

  .up { color: var(--accent-green-text); } .down { color: var(--accent-amber-text); } .flat { color: var(--text-secondary); }
  .code { font-size: 12px; color: var(--text-muted); }

  .toggle input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent-green); flex: 0 0 18px; }
  .toggle span { font-size: 14px; color: var(--text-secondary); }
  .toggle strong { display: block; color: var(--text-primary); font-size: 15px; margin-bottom: 2px; }

  /* 1.3.0 Anmeldung erklärt */
  .how { list-style: none; margin: 4px 0 0; padding: 0; }
  .how li { position: relative; padding-left: 26px; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.5; }
  .how li b { color: var(--text-primary); font-weight: 600; }
  .how li::before { content: attr(data-n); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-green-dim); color: var(--accent-green-text); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .linkbtn { background: none; border: 0; padding: 0; font: 600 13.5px 'DM Sans', sans-serif; color: var(--accent-blue-text); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 40px; }
  .hidden { display: none !important; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--brand-card2); border-top-color: var(--accent-green); animation: spin .8s linear infinite; margin: 60px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #raw { white-space: pre-wrap; font: 11px/1.4 ui-monospace, Menlo, monospace; background: #050c17; padding: 10px; border-radius: 8px; max-height: 280px; overflow: auto; margin-top: 18px; border: 1px solid rgba(245,166,35,.5); }

</style>

<script>
  /* Hell/Dunkel - dieselbe Logik wie im Vital-Check (index.html, v2.8.13). */
  (function () {
    var KEY = 'levita-theme';
    var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
    function pref() { try { var v = localStorage.getItem(KEY); return (v === 'hell' || v === 'dunkel') ? v : 'auto'; } catch (e) { return 'auto'; } }
    function eff() { var p = pref(); if (p !== 'auto') return p;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'hell' : 'dunkel'; }
    function apply() {
      var p = pref(), r = document.documentElement;
      if (p === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', p);
      var e = eff(), m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', e === 'hell' ? '#F7F6F2' : '#0a1628');
      var lbl = e === 'hell' ? 'Dunkles Design einschalten' : 'Helles Design einschalten';
      var bs = document.querySelectorAll('.theme-btn');
      for (var i = 0; i < bs.length; i++) { bs[i].innerHTML = e === 'hell' ? MOON : SUN; bs[i].setAttribute('aria-label', lbl); bs[i].title = lbl; }
    }
    window.toggleTheme = function () {
      var next = eff() === 'hell' ? 'dunkel' : 'hell';
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply();
    };
    if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: light)');
      var h = function () { if (pref() === 'auto') apply(); };
      if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply); else apply();
  })();
</script>
<script src="assets/konto.js?v=1.5.0"></script>
<script>
(() => {
  const FE_VERSION = "1.5.1";
  const K = window.LeVitaKonto;
  const esc = K.esc;
  const params = new URLSearchParams(location.search);
  const INTERNAL = params.get("internal") === "1";
  const TENANT = (params.get("studio") || "levita").trim().toLowerCase();
  const $app = document.getElementById("app");
  const $logout = document.getElementById("b-logout");
  document.getElementById("fe-version").textContent = FE_VERSION;

  let sess = null;

  const h = (html) => { $app.innerHTML = html; window.scrollTo({ top: 0, behavior: "smooth" }); };
  const spinner = () => h('<div class="spinner"></div>');
  const raw = (label, json) => {
    if (!INTERNAL) return;
    const el = document.getElementById("raw");
    el.classList.remove("hidden");
    el.textContent = label + "\n" + JSON.stringify(json, null, 2);
  };
  const dateDe = (iso) => { try { return new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); } catch { return ""; } };
  const weeksSince = (iso) => { const t = new Date(iso).getTime(); return isNaN(t) ? 99 : Math.floor((Date.now() - t) / (7 * 24 * 3600 * 1000)); };
  const num = (v, d = 0) => (v == null || isNaN(Number(v))) ? "–" : Number(v).toLocaleString("de-DE", { maximumFractionDigits: d, minimumFractionDigits: d });

  async function edge(mode, body) {
    const r = await K.edge(mode, Object.assign({ tenant: TENANT }, body || {}), sess && sess.access_token);
    raw(mode, r);
    if (r._http === 401) { K.logout(); sess = null; screenLogin("Deine Anmeldung auf diesem Gerät ist beendet. Fordere einfach einen neuen Link an."); throw new Error("401"); }
    return r;
  }

  // ── Anmelden: Link per Mail ────────────────────────────
  function screenLogin(msg = "", expired = false) {
    $logout.classList.add("hidden");
    h(`
      <h1>${expired ? "Der Link ist abgelaufen" : "Mein Bereich"}</h1>
      <p class="lead">${expired
        ? `Aus Sicherheitsgründen gilt ein Anmeldelink ${K.LINK_VALID || "eine Stunde"} und nur für einen Klick. Vielleicht wurde er schon benutzt, oder eine neuere Mail ist unterwegs. Gib deine E-Mail-Adresse ein, dann schicken wir dir einen neuen.`
        : "Hier liegen deine Vital-Checks mit Verlauf und dein Ernährungs-Check. Die Anmeldung läuft über einen Link per E-Mail, ein Passwort gibt es nicht."}</p>
      <div class="card">
        <div class="field"><label for="f-mail">E-Mail-Adresse</label>
          <input type="email" id="f-mail" autocomplete="email" placeholder="name@beispiel.de"></div>
        <button class="btn block" id="b-link">Zugangslink per E-Mail erhalten</button>
        <div class="error" id="err">${esc(msg)}</div>
      </div>
      <div class="card">
        <h3>So funktioniert die Anmeldung</h3>
        <ul class="how">
          <li data-n="1"><b>Link anfordern:</b> Wir schicken dir einen Link und einen 6-stelligen Code an deine E-Mail-Adresse.</li>
          <li data-n="2"><b>Innerhalb einer Stunde klicken:</b> Der Link funktioniert nur einmal. Öffne ihn am besten auf diesem Gerät.</li>
          <li data-n="3"><b>Angemeldet bleiben:</b> Danach bist du auf diesem Gerät angemeldet und brauchst keinen neuen Link – bis du dich abmeldest oder die Browserdaten löschst.</li>
        </ul>
        <button class="linkbtn" id="b-guide" type="button">Tipps und warum das sicher ist</button>
      </div>
      <p class="small">Noch kein Konto? Ein Konto legst du freiwillig nach deinem Vital-Check, im Ernährungs-Check oder für ein Gespräch im Studio an. Pilot-ID und PIN funktionieren weiterhin.</p>`);
    document.getElementById("b-guide").onclick = () => K.showGuide && K.showGuide();
    const send = async () => {
      const mail = document.getElementById("f-mail").value.trim();
      const err = document.getElementById("err");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) { err.textContent = "Bitte prüfe deine E-Mail-Adresse."; return; }
      const b = document.getElementById("b-link"); b.disabled = true; b.textContent = "Wird gesendet …";
      const r = await K.edge("login_link", { email: mail, tenant: TENANT, return_url: K.kontoPageUrl() });
      raw("login_link", r);
      if (!r.success) { b.disabled = false; b.textContent = "Zugangslink per E-Mail erhalten"; err.textContent = "Das hat gerade nicht geklappt. Bitte versuche es gleich noch einmal."; return; }
      h(`<div class="card ok"><h2>Schau in dein Postfach</h2>
          <p class="muted">Wenn zu <strong>${esc(mail)}</strong> ein Konto bei uns besteht, ist ein Anmeldelink unterwegs.</p>
          <ul class="how" style="margin-top:12px">
            <li data-n="1">Der Link gilt <b>${esc(K.LINK_VALID || "eine Stunde")}</b> und nur für einen Klick. Bei mehreren Mails nimm die neueste.</li>
            <li data-n="2">Öffne ihn auf dem Gerät, auf dem du angemeldet sein möchtest. Öffnet er sich in deiner Mail-App, wähle „Im Browser öffnen“.</li>
            <li data-n="3">Keine Mail da? Schau im Spam-Ordner nach. Einen neuen Link kannst du nach einer Minute anfordern.</li>
          </ul></div>
          <div class="card"><h3>Link funktioniert nicht?</h3>
            <p class="muted">Gib den 6-stelligen Code aus derselben Mail ein – das klappt auch, wenn sich der Link im falschen Browser öffnet.</p>
            <div class="field"><label for="f-code">Code aus der Mail</label>
              <input type="text" id="f-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456"></div>
            <button class="btn block" id="b-code" type="button">Mit Code anmelden</button>
            <div class="error" id="err-code"></div></div>
          <button class="btn ghost block" id="b-again" type="button">Andere Adresse oder neuen Link anfordern</button>`);
      document.getElementById("b-again").onclick = () => screenLogin();
      // 1.5.0 (Paket W5): einmaliger Code als Ausweg, wenn der Link vorab verbraucht wurde oder im falschen Browser landet
      const useCode = async () => {
        const bc = document.getElementById("b-code"), ec = document.getElementById("err-code");
        bc.disabled = true; bc.textContent = "Wird geprüft …";
        const rc = K.verifyCode ? await K.verifyCode(mail, document.getElementById("f-code").value) : { error: "OLD" };
        if (rc && rc.session) { location.reload(); return; }
        bc.disabled = false; bc.textContent = "Mit Code anmelden";
        ec.textContent = rc && rc.error === "CODE_FORMAT" ? "Bitte gib die 6 Ziffern aus der Mail ein." : "Der Code passt nicht oder ist abgelaufen. Nimm den Code aus der neuesten Mail oder fordere einen neuen Link an.";
      };
      document.getElementById("b-code").onclick = useCode;
      document.getElementById("f-code").onkeydown = (e) => { if (e.key === "Enter") useCode(); };
    };
    document.getElementById("b-link").onclick = send;
    document.getElementById("f-mail").onkeydown = (e) => { if (e.key === "Enter") send(); };
  }

  // ── Durchsicht: Gehört dieser Check zu dir? ────────────
  const ORIGIN_TEXT = {
    request: "Du hast diesen Check gerade für dein Konto angemeldet.",
    email_match: "Dieser frühere Check wurde mit deiner E-Mail-Adresse gemacht.",
    contact_existing: "Dieser Check ist bereits mit deiner E-Mail-Adresse verbunden.",
  };
  const FLAG_TEXT = { gender: "Geschlecht", age: "Alter", first_name: "Vorname" };

  function screenReview(review, firstLogin) {
    $logout.classList.remove("hidden");
    const item = review[0];
    const who = [item.first_name, item.age ? `${item.age} Jahre` : ""].filter(Boolean).join(", ");
    const flags = (item.mismatch || []).map((k) => FLAG_TEXT[k]).filter(Boolean);
    h(`
      ${firstLogin ? `<div class="card ok"><h3>Dein Konto ist aktiv</h3><p class="muted">Schön, dass du da bist. Bevor wir deinen Verlauf zeigen, schau bitte kurz auf ${review.length === 1 ? "diesen Check" : `diese ${review.length} Checks`}.</p></div>` : ""}
      <h1>Gehört dieser Check zu dir?</h1>
      <p class="lead">${review.length > 1 ? `Noch ${review.length} Checks zur Durchsicht.` : "Nur noch ein kurzer Blick."}</p>
      <div class="card">
        <h3>Vital-Check vom ${esc(dateDe(item.created_at))}</h3>
        <div class="rv-meta">${esc(who || "ohne Namen")} · <span class="code">${esc(item.public_code)}</span></div>
        <div class="rv-why">${esc(ORIGIN_TEXT[item.origin] || "")}</div>
        ${flags.length ? `<div class="rv-flag"><strong>Bitte genau hinsehen:</strong> ${esc(flags.join(", "))} ${flags.length === 1 ? "weicht" : "weichen"} von deinen anderen Angaben ab. Nutzt vielleicht noch jemand diese E-Mail-Adresse?</div>` : ""}
        <div class="row">
          <button class="btn" id="b-yes">Ja, das bin ich</button>
          <button class="btn ghost" id="b-no">Nein, nicht mein Check</button>
        </div>
        <div class="error" id="err"></div>
      </div>
      <p class="small">Ein Check, der nicht zu dir gehört, bleibt unverändert und ist weiter mit seiner Pilot-ID und PIN erreichbar. Für ein eigenes Konto braucht jede Person ihre eigene E-Mail-Adresse.</p>`);
    const decide = async (accept) => {
      document.getElementById("b-yes").disabled = true; document.getElementById("b-no").disabled = true;
      let r; try { r = await edge("resolve", { public_code: item.public_code, accept }); } catch { return; }
      if (!r.success && r.error !== "NOTHING_TO_RESOLVE") {
        document.getElementById("err").textContent = "Das hat gerade nicht geklappt. Bitte versuche es noch einmal.";
        document.getElementById("b-yes").disabled = false; document.getElementById("b-no").disabled = false;
        return;
      }
      const rest = (r.review || []);
      if (rest.length) return screenReview(rest, false);
      screenHome();
    };
    document.getElementById("b-yes").onclick = () => decide(true);
    document.getElementById("b-no").onclick = () => decide(false);
  }

  // ── Übersicht ──────────────────────────────────────────
  // 1.4.0 (S1/V1–V4, Regelversion 2026-10-R1): Bei Hinweisstatus keine Stufe und kein Vitalitäts-Alter;
  // sonst das Alter nie unter 18 und als experimentelle Umrechnung gekennzeichnet.
  const CARE_ACTIVE = ["doctor_first", "care_note", "incomplete"];
  const VITAL_AGE_ENABLED = false;
  function checkLabel(c) {
    if (c.care_status && CARE_ACTIVE.includes(c.care_status)) {
      return c.care_status === "incomplete" ? "Lebensstilprofil · einige Fragen fehlen" : "Lebensstilprofil · bitte ärztlich besprechen";
    }
    // 1.5.1 (Paket S1, 20.10.2026): Vitalitäts-Alter abgeschaltet – auch für ältere Checks
    const age = VITAL_AGE_ENABLED && c.bio_age != null && isFinite(Number(c.bio_age)) ? Math.max(18, Math.round(Number(c.bio_age))) : null;
    return esc(c.score_label || "") + (age ? ` · Vitalitäts-Alter ${num(age)} <span class="note" style="display:inline">(experimentelle Umrechnung)</span>` : "");
  }
  // 1.4.0 (W1): feste Karte "Deine Zusatzmodule" zum neuesten Check
  function modulesCard(c) {
    if (!c || !c.public_code) return "";
    const code = encodeURIComponent(c.public_code);
    const doctor = c.care_status === "doctor_first";
    // 1.5.0 (Paket G): Zugang aus der Datenbank; ohne module_access (vor SQL 07) wie bisher
    const acc = (c.module_access && c.module_access.nutrition && c.module_access.supply) ? c.module_access : null;
    const nOk = acc ? acc.nutrition.ok : !doctor, sOk = acc ? acc.supply.ok : !doctor;
    const nTxt = acc && !acc.nutrition.ok ? acc.nutrition.state : "Zuerst ärztlich abklären – danach ist der Ernährungs-Check für dich da.";
    const sTxt = acc && !acc.supply.ok ? acc.supply.state : "Zuerst ärztlich abklären – Nahrungsergänzung besprichst du am besten in der Praxis.";
    const row = (name, state, href) => `<div style="padding:12px 0;border-top:1px solid var(--border);">
        <div style="font-weight:700;">${esc(name)}</div>
        <div class="muted" style="margin:2px 0 ${href ? 8 : 0}px;">${esc(state)}</div>
        ${href ? `<a class="btn" style="display:inline-block;padding:8px 16px;font-size:14px;" href="${href}">Öffnen →</a>` : ""}</div>`;
    return `<div class="card">
        <h2>Deine Zusatzmodule</h2>
        <p class="muted">Zu deinem Check vom ${esc(dateDe(c.created_at))} – mit deinem Konto ohne PIN.</p>
        ${row("Ernährungs-Check", !nOk ? nTxt
              : "Verfügbar – wo beim Essen das meiste Potenzial liegt, ohne Diät und ohne Verbote.",
              !nOk ? "" : `ernaehrung.html?code=${code}&utm_source=konto&utm_medium=modulkarte`)}
        ${row("Versorgungs-Check", !sOk ? sTxt
              : c.supply_done ? "Abgeschlossen – dein Versorgungsplan ist gespeichert." : "Verfügbar – ordnet ein, ob deine Nahrungsergänzung zu deinen Angaben passt.",
              !sOk ? "" : `versorgung.html?code=${code}&utm_source=konto&utm_medium=modulkarte`)}
      </div>`;
  }

  async function screenHome(note = "") {
    $logout.classList.remove("hidden");
    spinner();
    let acc, checks;
    try {
      [acc, checks] = await Promise.all([
        K.rpc("my_account", { p_tenant_id: K.tenantId }, sess.access_token),
        K.rpc("my_checks", { p_tenant_id: K.tenantId }, sess.access_token),
      ]);
    } catch (e) {
      const again = await K.session();
      if (!again) return screenLogin("Deine Anmeldung auf diesem Gerät ist beendet. Fordere einfach einen neuen Link an.");
      sess = again;
      return screenHome(note);
    }
    raw("my_account / my_checks", { acc, checks });
    if (!acc) return screenNoAccount();
    const list = Array.isArray(checks) ? checks.slice().reverse() : [];   // neueste zuerst
    const cons = acc.consents || {};
    const remOn = !!(cons.appointment_reminder && cons.appointment_reminder.granted);

    const rows = list.map((c, i) => {
      const prev = list[i + 1];
      let delta = "";
      if (prev && c.total_score != null && prev.total_score != null) {
        const d = Number(c.total_score) - Number(prev.total_score);
        delta = Math.abs(d) < 2
          ? `<div class="delta flat">stabil gehalten</div>`
          : `<div class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${num(Math.abs(d), 1)} seit ${esc(dateDe(prev.created_at))}</div>`;
      }
      return `<div class="check">
          <div><div class="date">${esc(dateDe(c.created_at))}</div>
            <div class="label">${checkLabel(c)}</div>
            <div class="code">${esc(c.public_code)}</div>
            <a class="open-link" href="index.html?code=${encodeURIComponent(c.public_code)}" data-open="${esc(c.public_code)}">Ergebnis ansehen →</a></div>
          <div><div class="score">${num(c.total_score)}<small> /100</small></div>${delta}</div>
        </div>`;
    }).join("");

    h(`
      <h1>Hallo${acc.first_name ? " " + esc(acc.first_name) : ""}</h1>
      <p class="lead">Dein persönlicher Bereich bei LeVITA.</p>
      ${note ? `<div class="card ok"><p class="muted" style="margin:0">${esc(note)}</p></div>` : ""}

      <div class="card">
        <h2>Deine Vital-Checks</h2>
        ${list.length ? rows : `<p class="muted">Noch kein Check in deinem Konto.</p>`}
        ${list.length ? `<a class="btn block" style="margin-top:16px" href="index.html?recheck=${encodeURIComponent(list[0].public_code)}">Neuen Vital-Check starten</a>
          <p class="recheck-hint">${weeksSince(list[0].created_at) < 8
            ? `Dein letzter Check ist ${weeksSince(list[0].created_at) <= 1 ? "erst wenige Tage" : `${weeksSince(list[0].created_at)} Wochen`} her. Am aussagekräftigsten ist der Vergleich nach 8 bis 12 Wochen.`
            : "Dein neues Ergebnis wird automatisch mit dem letzten verglichen."}</p>` : ""}
      </div>

      ${list.length ? modulesCard(list[0]) : ""}

      <div class="card">
        <h2>E-Mails von uns</h2>
        <label class="toggle"><input type="checkbox" id="t-rem" ${remOn ? "checked" : ""}>
          <span><strong>Erinnerungen</strong>Vor vereinbarten Terminen und an deinen nächsten Vital-Check.</span></label>
        <div class="error" id="err-c"></div>
      </div>

      <div class="card">
        <h2>Anmeldung und Sicherheit</h2>
        <p class="muted">Du bleibst auf diesem Gerät angemeldet und brauchst hier keinen neuen Link. Auf einem anderen Gerät forderst du einfach einen Anmeldelink an – er gilt ${esc(K.LINK_VALID || "eine Stunde")} und nur für einen Klick.</p>
        <p class="note">Tipp: Leg dir diese Seite als Lesezeichen oder auf den Home-Bildschirm. Auf geteilten Geräten nach der Nutzung oben „Abmelden“.</p>
        <button class="linkbtn" id="b-guide" type="button" style="margin-top:10px">Tipps und warum das sicher ist</button>
      </div>

      <div class="card danger">
        <h3>Konto löschen</h3>
        <p class="muted">Löscht dein Konto bei LeVITA und alle zugehörigen Daten: Vital-Checks, Ernährungs-Check, Termine und Messwerte. Das lässt sich nicht rückgängig machen.</p>
        <div id="del-area"><button class="btn ghost" id="b-del-open" style="margin-top:12px">Konto löschen …</button></div>
      </div>

      <p class="small">Angemeldet als ${esc(acc.email)}</p>`);

    const bindToggle = (id, purpose) => {
      const box = document.getElementById(id);
      box.onchange = async () => {
        box.disabled = true;
        let r; try { r = await edge("set_consent", { purpose, granted: box.checked }); } catch { return; }
        box.disabled = false;
        if (!r.success) { box.checked = !box.checked; document.getElementById("err-c").textContent = "Das hat gerade nicht geklappt. Bitte versuche es noch einmal."; }
        else document.getElementById("err-c").textContent = "";
      };
    };
    bindToggle("t-rem", "reminders");
    document.getElementById("b-guide").onclick = () => K.showGuide && K.showGuide();

    document.getElementById("b-del-open").onclick = () => {
      document.getElementById("del-area").innerHTML = `
        <div class="field" style="margin-top:14px"><label for="f-del">Zur Bestätigung bitte <strong>LÖSCHEN</strong> eingeben</label>
          <input type="text" id="f-del" autocomplete="off"></div>
        <button class="btn red block" id="b-del" disabled>Endgültig löschen</button>
        <div class="error" id="err-d"></div>`;
      const f = document.getElementById("f-del"), b = document.getElementById("b-del");
      f.oninput = () => (b.disabled = f.value.trim() !== "LÖSCHEN");
      b.onclick = async () => {
        b.disabled = true; b.textContent = "Wird gelöscht …";
        let r; try { r = await edge("delete_account", { confirm: "LÖSCHEN" }); } catch { return; }
        if (!r.success) { b.disabled = false; b.textContent = "Endgültig löschen"; document.getElementById("err-d").textContent = "Das hat gerade nicht geklappt. Bitte versuche es noch einmal oder schreib uns an info@le-vita.com."; return; }
        K.logout(); sess = null; $logout.classList.add("hidden");
        h(`<div class="card ok"><h2>Dein Konto ist gelöscht</h2>
            <p class="muted">Wir haben ${r.deleted_checks === 1 ? "einen Vital-Check" : `${num(r.deleted_checks)} Vital-Checks`} und alle zugehörigen Daten gelöscht.${r.other_studios ? " Deine Konten bei anderen Studios bleiben bestehen." : ""}</p></div>`);
      };
    };
  }

  function screenNoAccount() {
    $logout.classList.remove("hidden");
    h(`<h1>Noch kein Konto bei LeVITA</h1>
       <div class="card"><p class="muted">Zu dieser Anmeldung gibt es bei LeVITA noch kein Konto. Ein Konto entsteht, wenn du es nach deinem Vital-Check, im Ernährungs-Check oder für ein Gespräch im Studio anlegst und den Link in der Mail bestätigst.</p></div>`);
  }

  // ── Los ────────────────────────────────────────────────
  $logout.onclick = () => { K.logout(); sess = null; screenLogin("Du bist abgemeldet. Für die nächste Anmeldung auf diesem Gerät schicken wir dir einen neuen Link."); };

  (async () => {
    // 1.5.0 (Paket W5): Link aus der Mail – erst der Klick auf "Jetzt anmelden" meldet an
    const pend = K.pendingLink ? K.pendingLink() : null;
    if (pend) {
      h(`<h1>Fast geschafft</h1>
        <div class="card"><p class="lead" style="margin-top:0">Mit einem Klick bist du auf diesem Gerät angemeldet.</p>
        <button class="btn block" id="b-go" type="button">Jetzt anmelden</button><div class="error" id="err-go"></div></div>`);
      document.getElementById("b-go").onclick = async () => {
        const bg = document.getElementById("b-go"); bg.disabled = true; bg.textContent = "Wird angemeldet …";
        const rv = await K.verifyLink(pend);
        if (rv && rv.error) screenLogin("", true);
      };
      return;
    }
    const landed = K.consumeRedirect();
    if (landed && landed.error) {
      const expired = /expired|invalid|otp/i.test(landed.error + " " + landed.description);
      return screenLogin(expired ? "" : "Die Anmeldung hat nicht geklappt. Fordere einfach einen neuen Link an.", expired);
    }
    sess = await K.session();
    if (!sess) return screenLogin();
    let r; try { r = await edge("confirm"); } catch { return; }
    if (!r.success) {
      if (r.error === "TRAINER_ACCOUNT") { K.logout(); sess = null; return screenLogin("Mit einem Trainerzugang gibt es keinen persönlichen Bereich. Bitte nutze deine private E-Mail-Adresse."); }
      return h(`<div class="card warn"><h3>Das hat gerade nicht geklappt</h3><p class="muted">Bitte lade die Seite in einem Moment neu.</p></div>`);
    }
    if (r.status === "no_account") return screenNoAccount();
    // 1.3.0: Einmaliges Erklärfenster bei der Einrichtung (erste Anmeldung oder erste Landung auf diesem Gerät)
    const showIntro = () => { if ((r.first_login || (landed && landed.fresh)) && K.showGuide) K.showGuide({ once: true }); };
    if ((r.review || []).length) { screenReview(r.review, !!r.first_login); return showIntro(); }
    await screenHome();
    showIntro();
  })();
})();
</script>
</body>
</html>
