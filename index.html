<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeVITA Vital-Check powered by LogiVita</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --brand-dark: #0a1628;
      --brand-card: #132338;
      --accent-green: #22c97a;
      --accent-green-dim: rgba(34,201,122,0.12);
      --accent-blue: #3b9eff;
      --accent-blue-dim: rgba(59,158,255,0.10);
      --accent-amber: #f5a623;
      --accent-red: #ff5c5c;
      --text-primary: #f0f4f8;
      --text-secondary: #8da0b8;
      --text-muted: #4a6280;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--brand-dark); color: var(--text-primary); min-height: 100vh; padding: 20px; }
    .container { max-width: 720px; margin: 0 auto; }
    .logo-area { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; padding-top: 12px; }
    .logo-img-wrap { margin-bottom: 10px; }
    .logo-img-wrap img { max-height: 60px; max-width: 220px; object-fit: contain; }
    .logo-placeholder { width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-blue) 100%); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #0a1628; margin-bottom: 10px; }
    .logo-name { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--text-primary); }
    .logo-name span { color: var(--accent-green); }
    .logo-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    .progress-wrap { margin-bottom: 28px; }
    .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-area-label { font-size: 11px; font-weight: 700; color: var(--accent-green); letter-spacing: 1.5px; text-transform: uppercase; }
    .progress-count { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
    #progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-green), var(--accent-blue)); border-radius: 2px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); width: 0%; }
    .progress-back-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0 8px 0 0; line-height: 1; flex-shrink: 0; transition: color 0.2s; width: auto; margin: 0; }
    .progress-back-btn:hover { color: var(--accent-green); transform: none; box-shadow: none; }
    .progress-back-btn.hidden { visibility: hidden; pointer-events: none; }
    .progress-left { display: flex; align-items: center; gap: 0; flex: 1; min-width: 0; }
    .option-btn.selected-flash { border-color: var(--accent-green); background: var(--accent-green-dim); transform: translateX(2px); }
    .option-btn.selected-flash::before { border-color: var(--accent-green); background: var(--accent-green); }
    .question-step { display: none; }
    .question-step.active { display: block; }
    .card { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; margin-bottom: 16px; }
    .area-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; background: var(--accent-blue-dim); border: 1px solid rgba(59,158,255,0.18); color: var(--accent-blue); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 16px; }
    .question-text { font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--text-primary); margin-bottom: 6px; }
    .help-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
    .options-grid { display: flex; flex-direction: column; gap: 9px; }
    .option-btn { width: 100%; padding: 15px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 12px; }
    .option-btn::before { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); flex-shrink: 0; transition: all 0.18s; }
    .option-btn:hover { border-color: var(--accent-green); background: var(--accent-green-dim); transform: translateX(2px); }
    .option-btn:hover::before { border-color: var(--accent-green); background: var(--accent-green); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.8px; text-transform: uppercase; }
    .form-field input, .form-field select { padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; transition: border-color 0.18s; width: 100%; -webkit-appearance: none; }
    .form-field input:focus, .form-field select:focus { outline: none; border-color: var(--accent-green); background: var(--accent-green-dim); }
    .form-field select option { background: #132338; color: var(--text-primary); }
    .next-btn { width: 100%; padding: 16px; border-radius: var(--radius-sm); border: none; background: linear-gradient(135deg, var(--accent-green) 0%, #1aaa65 100%); color: #0a1628; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; margin-top: 6px; }
    .next-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(34,201,122,0.25); }
    .next-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .secondary-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .secondary-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .danger-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: 1px solid rgba(255,92,92,0.3); background: rgba(255,92,92,0.08); color: var(--accent-red); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .checkbox-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
    .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; accent-color: var(--accent-green); }
    .checkbox-row label { font-size: 14px; color: var(--text-secondary); line-height: 1.5; cursor: pointer; }
    .info-box { padding: 16px 18px; border-radius: var(--radius-sm); margin-top: 16px; line-height: 1.6; font-size: 14px; }
    .box-info { background: var(--accent-blue-dim); border-left: 4px solid var(--accent-blue); color: var(--text-secondary); }
    .box-success { background: var(--accent-green-dim); border-left: 4px solid var(--accent-green); color: var(--text-secondary); }
    .box-warning { background: rgba(245,166,35,0.08); border-left: 4px solid var(--accent-amber); color: var(--text-secondary); }
    .box-danger { background: rgba(255,92,92,0.08); border-left: 4px solid var(--accent-red); color: var(--text-secondary); }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 40px; font-size: 16px; color: var(--text-secondary); font-weight: 500; }
    .result-area { display: none; }
    .pilot-code-box { text-align: center; background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 20px; margin-bottom: 20px; font-size: 13px; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .pilot-code-box strong { color: var(--text-primary); font-size: 15px; }
    .score-hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
    .score-ring-wrap { position: relative; width: 190px; height: 190px; margin-bottom: 16px; }
    .score-ring-svg { width: 190px; height: 190px; transform: rotate(-90deg); }
    .score-ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 13; }
    .score-ring-fill { fill: none; stroke-width: 13; stroke-linecap: round; stroke-dasharray: 515; stroke-dashoffset: 515; transition: stroke-dashoffset 1.4s cubic-bezier(0.4,0,0.2,1), stroke 0.5s; }
    .score-ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .score-number { font-family: 'DM Serif Display', serif; font-size: 54px; line-height: 1; margin-bottom: 2px; transition: color 0.5s; }
    .score-of { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .score-level-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 18px; border-radius: 30px; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .score-bio-age { font-size: 14px; color: var(--text-secondary); font-weight: 500; text-align: center; }
    .score-bio-age strong { color: var(--accent-green); font-weight: 700; }
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .kpi-card { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 12px; text-align: center; }
    .kpi-icon { font-size: 20px; margin-bottom: 6px; display: block; }
    .kpi-val { font-size: 22px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .kpi-label { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
    .basisdaten-box { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { display: inline-block; padding: 5px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .section-card { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 16px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .toggle-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .toggle-btn.on { background: var(--accent-green-dim); border-color: var(--accent-green); color: var(--accent-green); }
    .vital-index-box { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 16px; }
    .vital-index-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 13px; border: 1px solid transparent; }
    .vital-index-row.active-level { background: var(--accent-green-dim); border-color: rgba(34,201,122,0.2); }
    .vital-index-value { font-weight: 800; white-space: nowrap; color: var(--text-primary); min-width: 52px; }
    .vital-index-label { flex: 1; color: var(--text-secondary); line-height: 1.5; }
    .vital-index-note { margin-top: 14px; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .radar-explain-box { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 16px; }
    .radar-explain-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
    .radar-explain-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .radar-explain-card strong { display: block; color: var(--text-primary); font-size: 14px; margin-bottom: 8px; }
    .score-scale-item { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; font-size: 12px; margin-bottom: 4px; }
    .score-scale-item span { font-weight: 800; white-space: nowrap; min-width: 48px; }
    .ssi-green { background: rgba(34,201,122,0.1); color: var(--accent-green); }
    .ssi-lgreen { background: rgba(59,200,100,0.08); color: #5edb97; }
    .ssi-amber { background: rgba(245,166,35,0.1); color: var(--accent-amber); }
    .ssi-red { background: rgba(255,92,92,0.1); color: var(--accent-red); }
    .areas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .area-card { background: var(--brand-card); border: 1px solid var(--border); border-left: 3px solid transparent; border-radius: var(--radius-sm); padding: 14px; cursor: pointer; transition: all 0.2s; }
    .area-card:hover { transform: translateY(-1px); border-color: var(--border-hover); }
    .area-card.area-good { border-left-color: var(--accent-green); }
    .area-card.area-medium { border-left-color: var(--accent-amber); }
    .area-card.area-low { border-left-color: var(--accent-red); }
    .area-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .area-card-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .area-score-pill { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 10px; }
    .area-good .area-score-pill { background: rgba(34,201,122,0.15); color: var(--accent-green); }
    .area-medium .area-score-pill { background: rgba(245,166,35,0.15); color: var(--accent-amber); }
    .area-low .area-score-pill { background: rgba(255,92,92,0.15); color: var(--accent-red); }
    .area-bar-track { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
    .area-bar-fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }
    .area-good .area-bar-fill { background: var(--accent-green); }
    .area-medium .area-bar-fill { background: var(--accent-amber); }
    .area-low .area-bar-fill { background: var(--accent-red); }
    .area-status { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .area-good .area-status { color: var(--accent-green); }
    .area-medium .area-status { color: var(--accent-amber); }
    .area-low .area-status { color: var(--accent-red); }
    .area-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .area-detail.open { display: block; }
    .insight-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; margin-top: 8px; }
    .insight-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
    .tap-hint { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: right; }
    .bmi-detail { margin-top: 8px; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .hebel-box { background: var(--brand-card); border: 1px solid rgba(59,158,255,0.18); border-left: 4px solid var(--accent-blue); border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; }
    .hebel-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .hebel-title { font-size: 11px; font-weight: 700; color: var(--accent-blue); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
    .hebel-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .hebel-text strong { color: var(--text-primary); }
    .support-box { background: var(--accent-green-dim); border: 1px solid rgba(34,201,122,0.2); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 16px; }
    .support-box h3 { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; }
    .support-hints { list-style: none; padding: 0; margin: 0 0 12px; }
    .support-hints li { padding: 10px 12px; margin-bottom: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(34,201,122,0.12); border-radius: 8px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .redflag-box { background: rgba(255,92,92,0.08); border: 1px solid rgba(255,92,92,0.25); border-left: 4px solid var(--accent-red); border-radius: var(--radius-sm); padding: 18px 20px; margin-bottom: 16px; font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    .hint-box { border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .ai-box { background: linear-gradient(135deg, rgba(34,201,122,0.05) 0%, rgba(59,158,255,0.05) 100%); border: 1px solid rgba(34,201,122,0.18); border-radius: var(--radius); padding: 26px 22px; margin-bottom: 16px; text-align: center; }
    .ai-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 20px; background: var(--accent-green-dim); border: 1px solid rgba(34,201,122,0.25); color: var(--accent-green); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .ai-title { font-size: 19px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .ai-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 18px; }
    .ai-box input[type="email"] { width: 100%; padding: 13px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 15px; margin-bottom: 12px; text-align: center; }
    .ai-box input[type="email"]:focus { outline: none; border-color: var(--accent-green); }
    .ai-consent { text-align: left; margin-bottom: 14px; }
    .ai-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: var(--radius-sm); border: none; background: var(--accent-green); color: #0a1628; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.2s; width: 100%; }
    .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(34,201,122,0.25); }
    .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .feedback-box { background: var(--brand-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 16px; text-align: center; }
    .feedback-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .feedback-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }
    .disclaimer { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.6; padding: 16px; margin-top: 8px; }
    .status-msg { padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 10px; line-height: 1.5; }
    @media print {
      body { background: white !important; color: #1a1a2e !important; padding: 0; }
      .ai-box, .feedback-box, .danger-btn, #quiz-flow, .progress-wrap, .toggle-btn { display: none !important; }
      .result-area { display: block !important; }
      .card, .section-card, .vital-index-box, .radar-explain-box, .areas-grid, .support-box, .hebel-box, .basisdaten-box { background: #f8f9fa !important; border-color: #dee2e6 !important; break-inside: avoid; }
      .score-number, .kpi-val { color: #1a1a2e !important; }
      .text-secondary, .vital-index-label, .help-text { color: #555 !important; }
    }
    @media (max-width: 600px) {
      .areas-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: 1fr 1fr; }
      .radar-explain-grid { grid-template-columns: 1fr; }
      .score-number { font-size: 46px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-area" id="logoArea">
    <div id="logoDisplay"></div>
    <div class="logo-name">Le<span>VITA</span></div>
    <div class="logo-sub">powered by <strong>LogiVita</strong></div>
  </div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-meta">
      <div class="progress-left">
        <button class="progress-back-btn hidden" id="backBtn" onclick="goBack()" title="Zurück">←</button>
        <span class="progress-area-label" id="progressAreaLabel">Vorbereitung</span>
      </div>
      <span class="progress-count" id="progressCount"></span>
    </div>
    <div class="progress-track"><div id="progress-fill"></div></div>
  </div>
  <div id="loading" class="loading">Fragen werden geladen…</div>
  <div id="quiz-flow"></div>
  <div id="result-area" class="result-area">
    <div id="result-content"></div>
  </div>
</div>
<script>
  /* ── KONFIGURATION ── */
  const SUPABASE_URL = "https://koctweetotpqaazeicwj.supabase.co";

  /* ── LOAD QUESTIONS ── */
  async function loadQuestions() {
    const { data, error } = await supabaseClient
      .from("public_active_questions").select("*")
      .order("question_sort_order", { ascending: true })
      .order("option_sort_order", { ascending: true });
    if (error) throw error;
    const map = {};
    data.forEach(row => {
      if (!map[row.question_id]) {
        map[row.question_id] = {
          question_id:row.question_id,
          question_key:row.question_key,
          area_key:row.area_key,
          area_label:row.area_label,
          question_text:row.question_text,
          help_text:row.help_text,
          sort_order:row.question_sort_order,
          min_age: row.min_age || null,
          max_age: row.max_age || null,
          options:[]
        };
      }
      map[row.question_id].options.push({ option_id:row.option_id, option_text:row.option_text });
    });
    questions = Object.values(map).sort((a,b) => a.sort_order - b.sort_order);
    groupedQuestions = [{ type:"personal" }, ...questions, { type:"consent" }];
  }

  /* ── GENDER + ALTER FILTER ── */
  function isFemaleSpecific(q) {
    const key = String(q.question_key || "").toLowerCase();
    const text = `${q.question_text||""} ${q.help_text||""} ${q.area_label||""}`.toLowerCase();
    const kw = ["female","woman","women","frau","frauen","weiblich","menstru","zyklus","periode","regelblut","pms","wechseljah","schwanger","geburt","hormonell"];
    return kw.some(k => key.includes(k) || text.includes(k));
  }

  function buildGroupedQuestionsForGender() {
    const showFemale = personalData.gender === "weiblich";
    const age = personalData.age || 0;

    const filtered = questions.filter(q => {
      // Geschlechterfilter
      if (!showFemale && isFemaleSpecific(q)) return false;
      // Altersfilter min_age
      if (q.min_age !== null && age < q.min_age) return false;
      // Altersfilter max_age
      if (q.max_age !== null && age > q.max_age) return false;
      return true;
    });

    groupedQuestions = [{ type:"personal" }, ...filtered, { type:"consent" }];
  }

  /* ── BUILD STEPS ── */
  function buildSteps() {
    const flow = document.getElementById("quiz-flow");
    flow.innerHTML = "";
    groupedQuestions.forEach((step, index) => {
      const div = document.createElement("div");
      div.className = `question-step${index === 0 ? " active" : ""}`;
      div.id = `step-${index}`;
      if (step.type === "personal") div.innerHTML = personalStepHtml();
      else if (step.type === "consent") div.innerHTML = consentStepHtml();
      else div.innerHTML = questionStepHtml(step);
      flow.appendChild(div);
    });
  }

  function questionStepHtml(q) {

    let html = `<div class="card"><div class="area-badge">${icon} ${q.area_label || q.area_key}</div><div class="question-text">${q.question_text}</div>`;

  /* ── NAVIGATION ── */
  function savePersonalData() {
    const age = Number(document.getElementById("age").value);
    const gender = document.getElementById("gender").value;
    const height_cm = Number(document.getElementById("height_cm").value);
    const weight_kg = Number(document.getElementById("weight_kg").value);
    if (!age || age < 14 || age > 100) return alert("Bitte ein gültiges Alter eingeben.");
    if (!gender) return alert("Bitte Geschlecht auswählen.");
    if (!height_cm || height_cm < 120 || height_cm > 230) return alert("Bitte eine gültige Größe eingeben.");
    if (!weight_kg || weight_kg < 35 || weight_kg > 250) return alert("Bitte ein gültiges Gewicht eingeben.");
    personalData.first_name = document.getElementById("first_name").value.trim();
    personalData.last_name = document.getElementById("last_name").value.trim();
    personalData.age = age; personalData.gender = gender; personalData.height_cm = height_cm; personalData.weight_kg = weight_kg;
    buildGroupedQuestionsForGender();
    buildSteps();
    currentStep = 0;
    nextStep();
  }

  function saveAnswer(optionId) {
    // Mikro-Feedback: kurzes visuelles Highlight der gewählten Antwort
    const activeStep = document.getElementById(`step-${currentStep}`);
    if (activeStep) {
      const btns = activeStep.querySelectorAll(".option-btn");
      btns.forEach(btn => {
        if (btn.getAttribute("onclick") && btn.getAttribute("onclick").includes(optionId)) {
          btn.classList.add("selected-flash");
        }
      });
    }
    // 200ms Verzögerung für natürliches Gefühl
    setTimeout(() => {
      selectedAnswers.push({ option_id: optionId });
      nextStep();
    }, 200);
  }

  function goBack() {
    // Nur ab Schritt 2 zurück (nicht von Frage 1 zurück zu Basisdaten)
    if (currentStep < 2) return;
    const cur = document.getElementById(`step-${currentStep}`);
    if (cur) cur.classList.remove("active");
    currentStep--;
    // Letzte Antwort entfernen (nur wenn es eine Frage war, nicht personal/consent)
    const prevQ = groupedQuestions[currentStep];
    if (prevQ && prevQ.type !== "personal" && prevQ.type !== "consent") {
      selectedAnswers.pop();
    }
    const prev = document.getElementById(`step-${currentStep}`);
    if (prev) prev.classList.add("active");
    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function nextStep() {
    const cur = document.getElementById(`step-${currentStep}`);
    if (cur) cur.classList.remove("active");
    currentStep++;
    const nxt = document.getElementById(`step-${currentStep}`);
    if (nxt) nxt.classList.add("active");
    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updateProgress() {
    const total = groupedQuestions.length - 1;
    const pct = total > 0 ? (currentStep / total) * 100 : 0;
    document.getElementById("progress-fill").style.width = `${pct}%`;

    // Zurück-Button: ab Schritt 2 sichtbar, bei consent ausblenden
    const backBtn = document.getElementById("backBtn");
    const q = groupedQuestions[currentStep];
    if (backBtn) {
      const showBack = currentStep >= 2 && q && q.type !== "consent";
      backBtn.classList.toggle("hidden", !showBack);
    }

    if (!q) return;
    if (q.type === "personal") {
      document.getElementById("progressAreaLabel").textContent = "👤 Basisdaten";
      document.getElementById("progressCount").textContent = "";
    } else if (q.type === "consent") {
      document.getElementById("progressAreaLabel").textContent = "🔒 Fast fertig";
      document.getElementById("progressCount").textContent = "";
    } else {
      const icon = AREA_ICONS[q.area_key] || "●";
      const questionNumber = currentStep; // currentStep 1 = erste Frage nach Basisdaten
      const totalQuestions = total - 1; // -1 für consent
      document.getElementById("progressAreaLabel").textContent = `${icon} ${q.area_label || q.area_key}`;
      document.getElementById("progressCount").textContent = `Frage ${questionNumber} von ${totalQuestions}`;
    }
  }

  /* ── SUBMIT ── */
  async function submitInitialCheck() {
    const cp = document.getElementById("consent_privacy").checked;
    const cs = document.getElementById("consent_storage").checked;
    if (!cp || !cs) return alert("Bitte Datenschutz und Speicherung bestätigen.");
    personalData.consent_privacy = true; personalData.consent_storage = true;
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.innerText = "Auswertung wird erstellt…";
    try {
      const result = await callFunction({ age:personalData.age, gender:personalData.gender, height_cm:personalData.height_cm, weight_kg:personalData.weight_kg, first_name:personalData.first_name||null, last_name:personalData.last_name||null, consent_privacy:true, consent_storage:true, answers:selectedAnswers });
      latestResult = result;
      showResult(result);
    } catch (error) {
      alert("Fehler: " + error.message);
      btn.disabled = false; btn.innerText = "Auswertung erstellen →";
    }
  }

  async function requestIndividualAnalysis() {
    const email = document.getElementById("ai_email").value.trim();
    const ca = document.getElementById("consent_ai_analysis").checked;
    const cm = document.getElementById("consent_email_delivery").checked;
    const btn = document.getElementById("aiBtn");
    if (!email) return alert("Bitte E-Mail-Adresse eingeben.");
    if (!ca || !cm) return alert("Bitte beide Einwilligungen bestätigen.");
    btn.disabled = true; btn.innerText = "Auswertung wird erstellt…";
    try {
      const result = await callFunction({ mode:"request_ai_analysis", public_code:latestResult.public_code, email, consent_ai_analysis:true, consent_email_delivery:true });
      const statusEl = document.getElementById("ai-status");
      if (result.email_sent) { statusEl.innerHTML = `<div class="status-msg info-box box-success">✓ Deine individuelle Auswertung wurde per E-Mail versendet.</div>`; }
      else { statusEl.innerHTML = `<div class="status-msg info-box box-warning">Die Analyse wurde erstellt, aber der E-Mail-Versand konnte nicht bestätigt werden.</div>`; }
    } catch (error) { alert("Fehler: " + error.message); btn.disabled = false; btn.innerText = "Individuelle Auswertung per E-Mail anfordern →"; }
  }

  async function callFunction(payload) {
    const response = await fetch(FUNCTION_URL, { method:"POST", headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`}, body:JSON.stringify(payload) });
    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.error || "Unbekannter Fehler.");
    return result;
  }

  /* ── SHOW RESULT ── */
  function showResult(result) {
    document.getElementById("quiz-flow").style.display = "none";
    document.getElementById("progressWrap").style.display = "none";
    document.getElementById("loading").classList.add("hidden");
    const ra = document.getElementById("result-area");
    ra.style.display = "block";
    const sp = result.score?.score_payload || {};
    const areas = Object.entries(sp).map(([key, value]) => ({ key, label:value.label, score:Number(value.score), weight:value.weight }));
    const totalScore = Number(result.score?.total_score || 0);
    const bioAge = result.score?.bio_age || result.bio_age || null;
    const suppFocus = Array.isArray(result.supplement_focus) ? result.supplement_focus : [];
    document.getElementById("result-content").innerHTML = buildResultHtml(result, areas, totalScore, bioAge, suppFocus);
    setTimeout(() => animateScoreRing(totalScore), 100);
    setTimeout(() => renderRadarChart(areas), 200);
    setTimeout(() => { document.querySelectorAll(".area-bar-fill[data-w]").forEach(el => { el.style.width = el.getAttribute("data-w") + "%"; }); }, 300);
    ra.scrollIntoView({ behavior:"smooth" });
  }

  /* ── HELPERS ── */
  function getScoreColor(s) {
    if (s >= 85) return "#22c97a";
    if (s >= 70) return "#3b9eff";
    if (s >= 55) return "#f5a623";
    if (s >= 40) return "#ff8c42";
    return "#ff5c5c";
  }

  function animateScoreRing(target) {
    const el = document.getElementById("scoreDisplayNum");
    const ring = document.getElementById("scoreRingFill");
    if (!el || !ring) return;
    const C = 2 * Math.PI * 82;
    ring.setAttribute("stroke-dasharray", C);
    ring.setAttribute("stroke-dashoffset", C);
    ring.setAttribute("stroke", "url(#ringGrad)");
    let current = 0;
    const dur = 1400, start = performance.now();
    function step(now) {
      const prog = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - prog, 3);
      current = Math.round(target * ease);
      if (el) { el.textContent = current; el.style.color = getScoreColor(current); }
      if (ring) ring.style.strokeDashoffset = C - (current / 100) * C;
      if (prog < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function renderVitalIndexBox(score, label) {
    const ranges = [
      { min:85, max:100, value:"85–100", lbl:"Vital & Stabil", txt:"Sehr stabile Basis. Fokus auf Erhalt und Feinschliff." },
      { min:70, max:84.9, value:"70–84", lbl:"Aktiv mit Momentum", txt:"Gute Grundlage. Einzelne Stellschrauben können das Energielevel weiter verbessern." },
      { min:55, max:69.9, value:"55–69", lbl:"Auf dem Weg", txt:"Erkennbare Entwicklungsbereiche. Kleine Schritte bringen sichtbare Verbesserungen." },
      { min:40, max:54.9, value:"40–54", lbl:"Im Aufbau", txt:"Mehrere Faktoren beeinflussen das Energielevel. Starte mit 1–2 konkreten Hebeln." },
      { min:0, max:39.9, value:"unter 40", lbl:"Neustart", txt:"Regeneration und Alltag verdienen besondere Aufmerksamkeit. Starte niedrigschwellig." }
    ];
    const mots = { 85:"Deine Basis wirkt sehr stabil. Erhalte diese Routinen und nutze Feinschliff für weiteres Wachstum.", 70:"Du bist auf einem guten Level. Einzelne Hebel können deinen Index in den nächsten Wochen weiter stabilisieren.", 55:"Schon kleine regelmäßige Veränderungen können helfen, deinen Vitalitäts-Index spürbar zu verbessern.", 40:"Starte mit 1–2 einfachen Schritten und vergleiche den Index in 4–8 Wochen erneut.", 0:"Starte besonders niedrigschwellig. Bei anhaltenden Beschwerden kann zusätzliche Orientierung sinnvoll sein." };
    const mk = score>=85?85:score>=70?70:score>=55?55:score>=40?40:0;
    const rows = ranges.map(r => {
      const active = score >= r.min && score <= r.max;
      return `<div class="vital-index-row ${active?"active-level":""}">
        <span class="vital-index-value">${r.value}</span>
        <span class="vital-index-label"><strong>${r.lbl}</strong>${active?" ← dein Level":""}<br><small style="color:var(--text-muted);">${r.txt}</small></span>
      </div>`;
    }).join("");
    return `<div class="vital-index-box"><div class="section-title" style="margin-bottom:14px;">LeVITA Vitalitäts-Index</div>${rows}<div class="vital-index-note"><strong>Dein nächstes Ziel:</strong> ${mots[mk]}</div></div>`;
  }

  function renderRadarExplanation(areas) {
    const focus = [...areas].sort((a,b) => a.score-b.score).filter(a => a.score < 75).slice(0,3).map(a => a.label);
    const focusTxt = focus.length > 0
      ? `Bei dir liegen besonders <strong>${focus.join(", ")}</strong> weiter innen — das zeigt, wo kleine Hebel aktuell den größten Nutzen bringen.`
      : "Deine Bereiche wirken insgesamt stabil. Der Fokus liegt auf Erhalt und Feinschliff.";
    return `
      <div class="radar-explain-box">
        <div class="section-title" style="margin-bottom:14px;">So liest du dein Vitalitäts-Profil</div>
        <div class="radar-explain-grid">
          <div class="radar-explain-card"><strong>Was die Grafik zeigt</strong>Je weiter außen ein Punkt liegt, desto stabiler wirkt dieser Bereich. Innen liegende Bereiche zeigen mögliche Ansatzpunkte. Die Grafik ist keine medizinische Bewertung.</div>
          <div class="radar-explain-card"><strong>Einordnung der Werte</strong>
            <div class="score-scale-item ssi-green"><span>85–100</span>sehr stabile Grundlage</div>
            <div class="score-scale-item ssi-lgreen"><span>70–84</span>gute Basis mit Potenzial</div>
            <div class="score-scale-item ssi-amber"><span>55–69</span>sichtbare Stellschrauben</div>
            <div class="score-scale-item ssi-amber"><span>40–54</span>klarer Fokusbereich</div>

  }

  function renderAreaCard(area, result) {
    let cls = "area-good", statusTxt = "✓ Gute Grundlage";
    const bmi = area.key === "bmi" ? Number(result?.bmi) : null;
    if (area.key === "bmi" && bmi !== null) {
      if (bmi < 18.5) { cls = "area-medium"; statusTxt = "△ Niedriger Orientierungsbereich"; }
      else if (bmi < 25) { cls = "area-good"; statusTxt = "✓ Stabiler Bereich"; }
      else if (bmi < 30) { cls = "area-medium"; statusTxt = "△ Optimierungspotenzial"; }
      else { cls = "area-low"; statusTxt = "⚠ Fokusbereich"; }
    } else {
      if (area.score < 55) { cls = "area-low"; statusTxt = "⚠ Fokusbereich"; }
      else if (area.score < 75) { cls = "area-medium"; statusTxt = "△ Optimierungspotenzial"; }
    }
    const icon = AREA_ICONS[area.key] || "●";
    const bmiHtml = area.key === "bmi" ? renderBmiDetail(result) : "";
    return `
      <div class="area-card ${cls}" onclick="toggleAreaDetail('detail-${area.key}')">
        <div class="area-card-header">
          <div class="area-card-name">${icon} ${area.label}</div>
          <div class="area-score-pill">${Math.round(area.score)}</div>
        </div>
        <div class="area-bar-track"><div class="area-bar-fill" data-w="${Math.round(area.score)}" style="width:0%"></div></div>
        <div class="area-status">${statusTxt}</div>
        ${bmiHtml}
        <div class="area-detail" id="detail-${area.key}">
          <div class="insight-label">⚡ Sofort umsetzen</div>
          <div class="insight-text">${getInsightNow(area.key, area.score, result?.bmi)}</div>
          <div class="insight-label">📅 Mittelfristig</div>
          <div class="insight-text">${getInsightSoon(area.key, area.score, result?.bmi)}</div>
        </div>
        <div class="tap-hint">Tippen für Details</div>
      </div>`;
  }

  function toggleAreaDetail(id) { const el = document.getElementById(id); if (el) el.classList.toggle("open"); }

  function renderBmiDetail(result) {
    const bmi = Number(result?.bmi);
    if (!isFinite(bmi)) return "";
    let lbl = bmi < 18.5 ? "unterhalb des üblichen Orientierungsbereichs" : bmi < 25 ? "im stabilen Orientierungsbereich" : bmi < 30 ? "leicht oberhalb des klassischen Orientierungsbereichs" : "deutlich oberhalb des klassischen Orientierungsbereichs";
    return `<div class="bmi-detail"><strong>BMI: ${bmi.toFixed(1)}</strong> — ${lbl}.<br><small>Der BMI ist eine grobe Orientierung und sollte immer zusammen mit Muskelmasse, Aktivität und Wohlbefinden betrachtet werden.</small></div>`;
  }

  function getLevel(s) { return s < 55 ? "low" : s < 75 ? "medium" : "good"; }

  // Hilfe: BMI-Kategorie aus echtem BMI-Wert
  function getBmiCategory(bmiValue) {
    const bmi = Number(bmiValue);
    if (bmi < 18.5) return "low";       // untergewichtig
    if (bmi < 25)   return "normal";    // normal
    if (bmi < 30)   return "elevated";  // erhöht
    return "high";                       // deutlich erhöht
  }

  function renderRedFlagBox(score, totalScore) {
    if (score.doctor_hint) {
      return `<div class="redflag-box"><strong>⚠ RED FLAGS – bitte ernst nehmen</strong><br><br>Einige deiner Angaben zeigen stärkere Auffälligkeiten. Der LeVITA Vital-Check stellt keine Diagnose, aber in dieser Situation kann eine ärztliche Abklärung sinnvoll sein.<br><br><strong>Empfehlung:</strong> Bitte besprich auffällige Symptome, deutlichen ungewollten Gewichtsverlust, starke Erschöpfung oder anhaltende Niedergeschlagenheit mit einer Ärztin oder einem Arzt.</div>`;
    }
    if (totalScore < 55) {
      return `<div class="info-box box-info" style="margin-bottom:16px;"><strong>RED-FLAG-Check</strong><br>Aus deinen Angaben ergibt sich aktuell kein besonderer Hinweis auf stärkere Auffälligkeiten. Bei akuten Beschwerden oder anhaltend starker Belastung bitte immer medizinischen Rat einholen.</div>`;
    }
    return "";
  }

  function renderVitalitySupportBox(areas, result, suppFocus) {
    const scoreOf = key => { const a = areas.find(x => x.key === key); return a ? Number(a.score) : 100; };
    const bmiNum = Number(result?.bmi);
    const bmiIsLow = isFinite(bmiNum) && bmiNum < 18.5;
    const hints = [];

    suppFocus.slice(0,3).forEach(item => {
      if (item?.label) hints.push(`Deine Angaben deuten darauf hin, dass <strong>${item.label}</strong> als Orientierungsthema sinnvoll sein könnte${item.reason ? ` — ${item.reason}` : ""}.`);
    });

    // Bei niedrigem BMI: Ernährung und Regeneration priorisieren, keine Bewegungsempfehlung als erstes
    if (bmiIsLow && hints.length < 3) {
      hints.push("Deine Körperkomposition zeigt einen niedrigen Orientierungsbereich. Fokus auf regelmäßige Mahlzeiten, ausreichend Eiweiß und bewusste Regeneration — nicht auf mehr Kalorienverbrauch.");
    }

    const fb = [
      { key:"sleep",          max:75, bmiLowSafe:true,  text:"Schlaf und Abendroutine könnten deine Regeneration spürbar unterstützen. Schon ein stabiler Rhythmus kann ein guter erster Hebel sein." },
      { key:"mental",         max:75, bmiLowSafe:true,  text:"Mentale Balance und Erholung könnten deine Vitalität unterstützen. Oft hilft ein kleiner fester Pausenanker mehr als alles gleichzeitig zu verändern." },
      { key:"nutrition",      max:75, bmiLowSafe:true,  text:"Ernährung und Nährstoffqualität könnten ein guter Ansatzpunkt sein — besonders Eiweiß, Gemüse, Flüssigkeit und hochwertige Fettquellen." },
      { key:"micronutrients", max:75, bmiLowSafe:true,  text:"Bestimmte Nährstoff-Themen könnten eine bewusste Einordnung verdienen. Sinnvoll ist zuerst Ernährung — bei Bedarf ein Blutwert-Check." },
      { key:"vitamin_d",      max:75, bmiLowSafe:true,  text:"Regelmäßiges Tageslicht ist bei dir aktuell ein besonders sinnvoller Hebel für Energie, Schlafrhythmus und Vitamin-D-Orientierung." },
      { key:"activity",       max:75, bmiLowSafe:false, text:"Bewegung, Kraft und Regeneration können aktuell ein guter Hebel sein. Entscheidend ist ein kleiner, wiederholbarer Schritt." },
      { key:"lifestyle",      max:75, bmiLowSafe:true,  text:"Alkohol oder Nikotin können Schlaf und Regeneration beeinflussen. Ein bewusster Testtag hilft, den eigenen Zusammenhang besser zu erkennen." }
    ];

    for (const r of fb) {
      if (hints.length >= 3) break;
      // Bei niedrigem BMI keine Bewegungsempfehlung in der Support-Box
      if (bmiIsLow && !r.bmiLowSafe) continue;
      if (scoreOf(r.key) < r.max) hints.push(r.text);
    }

    if (hints.length === 0) hints.push("Deine Angaben zeigen in vielen Bereichen bereits eine gute Grundlage. Der wichtigste Hebel ist jetzt, stabile Routinen beizubehalten.");

    return `
      <div class="support-box">
        <h3>Was deine Vitalität aktuell besonders unterstützen könnte</h3>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5;">Nicht alles muss gleichzeitig verändert werden. Entscheidend ist, welche kleinen Hebel zu deinem Alltag passen.</p>
        <ul class="support-hints">${hints.slice(0,3).map(h => `<li>${h}</li>`).join("")}</ul>
        <div style="font-size:12px;color:var(--text-muted);line-height:1.5;">Diese Hinweise dienen der allgemeinen Orientierung und ersetzen keine medizinische Beratung. Eine ausführlichere Einordnung erhältst du in der individuellen Auswertung per E-Mail.</div>
      </div>`;
  }

  function renderHintBoxes(score) {
    let html = "";
    if (score.bloodtest_hint) html += `<div class="hint-box box-warning"><strong>💉 Hinweis: Trockenbluttest</strong><br>Aufgrund deiner Angaben könnte ein Trockenbluttest zusätzliche Hinweise liefern, um deine Vitalität und Mikronährstoffversorgung gezielter einzuordnen — z.B. Vitamin D, Ferritin, Omega-3 oder Vitamin B12. Im LeVITA Gesundheitsstudio besteht hierfür ein passendes Angebot.</div>`;
    if (score.coaching_hint) html += `<div class="hint-box box-success"><strong>🤝 Praktischer nächster Schritt</strong><br>Ein betreuter Trainingsplan, eine Körperanalyse oder kleine Alltagsroutinen können einen guten Einstieg bieten.</div>`;
    return html;
  }

  function renderRadarChart(areas) {
    const ctx = document.getElementById("vitalChart");
    if (!ctx) return;
    if (radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, {
      type:"radar",
      data:{
        labels: areas.map(a => a.label),
        datasets:[{
          label:"Aktueller Check",
          data: areas.map(a => Math.round(a.score)),
          backgroundColor:"rgba(59,158,255,0.15)",
          borderColor:"#3b9eff",
          borderWidth:2.5,
          pointBackgroundColor:"#3b9eff",
          pointRadius:4,
        }]
      },
      options:{
        scales:{ r:{ min:0, max:100, ticks:{ stepSize:25, color:"rgba(255,255,255,0.2)", font:{size:10}, backdropColor:"transparent" }, grid:{ color:"rgba(255,255,255,0.06)" }, angleLines:{ color:"rgba(255,255,255,0.06)" }, pointLabels:{ color:"#8da0b8", font:{size:11,weight:"600"} } } },
        plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:"#132338", borderColor:"rgba(255,255,255,0.1)", borderWidth:1, titleColor:"#f0f4f8", bodyColor:"#8da0b8" } },
        animation:{ duration:800 }
      }
    });
  }

  function toggleRadarComparison() {
    showComparison = !showComparison;
    const btn = document.getElementById("compareToggleBtn");
    if (btn) { btn.textContent = showComparison ? "✓ Verlauf aktiv" : "Verlauf einblenden"; btn.classList.toggle("on", showComparison); }
    const existing = document.getElementById("compareNote");
    if (showComparison) {
      if (!existing && radarChart) {
        const note = document.createElement("div");
        note.id = "compareNote";
        note.style.cssText = "font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;";
        note.textContent = "Verlaufsvergleich wird mit der Re-Check-Funktion in V2 verfügbar.";
        radarChart.canvas.parentNode.appendChild(note);
      }
    } else { if (existing) existing.remove(); }
  }

  function openGoogleForm() { window.open(GOOGLE_FORM_URL, "_blank"); }

  function resetVitalCheck() {
    if (!confirm("Möchtest du wirklich alle Eingaben zurücksetzen? Bereits übermittelte Daten in der Datenbank werden nicht gelöscht.")) return;
    questions=[]; groupedQuestions=[]; currentStep=0; selectedAnswers=[]; latestResult=null; showComparison=false;
    if (radarChart) { radarChart.destroy(); radarChart=null; }
    Object.assign(personalData, { age:null, gender:"", height_cm:null, weight_kg:null, email:"", first_name:"", last_name:"", consent_privacy:false, consent_storage:false });
    document.getElementById("result-area").style.display = "none";
    document.getElementById("result-content").innerHTML = "";
    document.getElementById("quiz-flow").style.display = "block";
    document.getElementById("progressWrap").style.display = "block";
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("loading").textContent = "Fragen werden geladen…";
    init();
  }

  init();
</script>
