<script>
  /* Hell/Dunkel wie im Vital-Check: gewaehltes Thema VOR dem ersten Zeichnen setzen.
     Gemeinsamer Schluessel "levita-theme" (gleiche Herkunft app.le-vita.com). */
  (function () { try { var t = localStorage.getItem('levita-theme');
    if (t === 'hell' || t === 'dunkel') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();

      --warn-text: #ffb347;
      --error-text: #ff8a8a;
      /* Schrift AUF einer Akzentflaeche (gruene/blaue Schaltflaechen). Bleibt in beiden Themen dunkel. */

      /* Zweiter Gruenton am Ende des Schaltflaechen-Verlaufs */
      --accent-green-deep: #1aaa65;

      --on-cta: #0d1a14;

      --violet-rgb: 139,92,246;
      --lgreen-alt-rgb: 59,200,100;

    function pref() { try { var v = localStorage.getItem(KEY); return (v === 'hell' || v === 'dunkel') ? v : 'auto'; } catch (e) { return 'auto'; } }
    function eff() { var p = pref(); if (p !== 'auto') return p;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'hell' : 'dunkel'; }
    function apply() {
      var p = pref(), r = document.documentElement;
      if (p === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', p);
      var e = eff(), m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', e === 'hell' ? '#F7F6F2' : '#0a1628');
      var lbl = e === 'hell' ? 'Dunkles Design einschalten' : 'Helles Design einschalten';
      var bs = document.querySelectorAll('.theme-btn');
      for (var i = 0; i < bs.length; i++) { bs[i].innerHTML = e === 'hell' ? MOON : SUN; bs[i].setAttribute('aria-label', lbl); bs[i].title = lbl; }

    window.toggleTheme = function () {

      apply();

      FEEDBACK_EMPTY: "Gib eine Bewertung oder ein paar Worte an.",
      STEP_UNKNOWN: "Diesen Schritt gibt es in deinem Ergebnis nicht.",
      STEP_STATE: "Das geht bei diesem Schritt gerade nicht.", LINK_INVALID: "Der Link aus der Mail ist abgelaufen oder ungültig. Melde dich mit Pilot-ID und PIN an – oder über Mein Bereich.", RATING: "Bitte wähle eine der drei Antworten.",
    })[e] || "Da ist etwas schiefgegangen. Bitte versuche es gleich noch einmal.";
  }

  // ── Start: Pilot-ID + PIN ───────────────────────────────
  function screenLogin(msg = "") {
    h(`
      <h1>Dein Ernährungs-Check</h1>
      <p class="lead">Ein paar Fragen zu deinem Alltag — danach siehst du, wo bei dir beim Essen das meiste Potenzial liegt,
        und wählst deine ersten Schritte. Ohne Diät, ohne Verbote.</p>
      <p class="phase-note" style="margin:-12px 0 18px">${esc(INTRO_NOTE)}</p>
      <div class="card">
        <div class="field"><label for="f-code">Pilot-ID aus deinem Vital-Check</label>
          <input type="text" id="f-code" autocomplete="off" placeholder="LEV-2026-000123" value="${esc(st.code)}"></div>
        <div class="field"><label for="f-pin">PIN aus deiner Mail</label>
          <input type="password" id="f-pin" inputmode="numeric" autocomplete="off" placeholder="8-stellig"></div>
        <button class="btn block" id="b-go">Weiter</button>
        <div class="error" id="err">${esc(msg)}</div>
      </div>
      <p class="small">Du findest Pilot-ID und PIN in der Mail zu deinem Vital-Check. Ohne Vital-Check ist der Ernährungs-Check nicht möglich — er baut auf deinen Antworten auf.</p>
      <p class="small">Mit persönlichem Konto geht es ohne PIN: Melde dich in <a href="konto.html" style="color:var(--accent-green-text)">Mein Bereich</a> mit einem Link per E-Mail an, danach bleibt dieses Gerät angemeldet und der Ernährungs-Check öffnet sich direkt. <a href="#" id="b-kguide" role="button" style="color:var(--accent-green-text);white-space:nowrap;display:inline-block;padding:2px 0;">So funktioniert die Anmeldung</a></p>`);
    const kg = document.getElementById("b-kguide");
    if (kg) kg.onclick = (e) => { e.preventDefault(); if (window.LeVitaKonto && window.LeVitaKonto.showGuide) window.LeVitaKonto.showGuide(); };
    const go = async () => {
      st.code = document.getElementById("f-code").value.trim().toUpperCase();
      st.pin = document.getElementById("f-pin").value.trim();
      if (!st.code || !st.pin) return (document.getElementById("err").textContent = errorText("PIN_REQUIRED"));
      spinner();
      st.acct = null;
      const r = await call("start");
      if (r.success) track("nutri_start", {}, true);
      route(r);
    };
    document.getElementById("b-go").onclick = go;
    document.getElementById("f-pin").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }

  // ── Verteiler nach Status ───────────────────────────────
  function route(r) {
    if (!r.success) return screenLogin(errorText(r.error));
    st.data = r;
    if (r.status === "consent_required") return screenConsent(r.consent);
    if (r.status === "not_eligible") return screenText(r.text, "info");
    if (r.status === "excluded") return screenExcluded(r);
    if (r.status === "screening" || r.editing) return startQuestionnaire(r);
    if (isIntroPhase(r) && r.confirmation && r.result) return screenSteps(r);
    if (r.confirmation && r.result) return screenConfirmed(r);
    return screenResult(r);
  }

  // ── Einwilligung ────────────────────────────────────────
  function screenConsent(c) {
    if (c?.trainer_optional) return screenConsentIntro(c);
    h(`
      <h1>Bevor es losgeht</h1>
      <p class="lead">Damit wir dich begleiten können, speichern wir deine Antworten und machen sie deinem Trainer oder deiner Trainerin im Studio zugänglich.</p>
      <div class="card">
        <label class="consent-box"><input type="checkbox" id="c-ok"><span>${esc(c?.text)}</span></label>
        <button class="btn block" id="b-c" disabled>Einverstanden, weiter</button>
      </div>
      <p class="small">Version ${esc(c?.version)}</p>`);
    const box = document.getElementById("c-ok"), btn = document.getElementById("b-c");
    box.onchange = () => (btn.disabled = !box.checked);
    btn.onclick = async () => {
      spinner();
      route(await call("start", { consent: { documentation: true, trainer_access: true } }));
    };
  }

  // 0.6.0 — Einführungsphase: Nutzung (Pflicht) und Trainer-Einsicht (freiwillig) getrennt
  function screenConsentIntro(c) {
    h(`
      <h1>Bevor es losgeht</h1>
      <p class="lead">Damit wir dir passende Schritte vorschlagen können, speichern wir deine Antworten.</p>
      <div class="card">
        <label class="consent-box"><input type="checkbox" id="c-ok"><span>${esc(c?.text)}</span></label>
        <label class="consent-box"><input type="checkbox" id="c-tr"><span>${esc(c?.trainer_text)}</span></label>
        <button class="btn block" id="b-c" disabled>Einverstanden, weiter</button>
      </div>
      <p class="small">Version ${esc(c?.version)} · ${esc(INTRO_NOTE)}</p>`);
    const box = document.getElementById("c-ok"), btn = document.getElementById("b-c");
    box.onchange = () => (btn.disabled = !box.checked);
    btn.onclick = async () => {

  // ── Texte für Nicht-Eignung und Ausschluss ──────────────
  function screenText(t, kind = "info") {
    h(`
      <div class="card ${kind}">
        <h2>${esc(t?.title || "Hier passt ein anderer Weg")}</h2>
        <p>${esc(t?.body || "")}</p>
      </div>
      <a class="btn ghost block" href="./${INTERNAL ? "?internal=1" : ""}">Zurück zum Vital-Check</a>`);
  }
  function screenExcluded(r) {
    if (r.text) return screenText(r.text, "info");
    // beim erneuten Laden fehlt der Text — dann allgemein
    screenText({ title: "Gerade passt etwas anderes besser",
      body: "Nach deinen Angaben ist dieses Programm im Moment nicht der richtige Rahmen für dich. Sprich uns im Studio gern an — wir finden gemeinsam einen passenden Weg." });
  }

  // ── Fragebogen ──────────────────────────────────────────
  function startQuestionnaire(r) {
    st.answers = {};
    for (const [k, v] of Object.entries(r.given || {})) {
      st.answers[k] = v.text != null ? { text: v.text } : { options: [...(v.options || [])] };
    }
    st.parts = Object.keys(PARTS).filter((p) => r.questions.some((q) => q.part === p));
    st.partIdx = 0;
    const d = loadDraft();
    if (d && d.answers && !r.editing) { Object.assign(st.answers, d.answers); st.partIdx = Math.min(d.partIdx || 0, st.parts.length - 1); }
    renderPart();
  }

  // Bedingte Fragen (show_if): Bezugsfrage im Bogen → nach aktueller Antwort; Bezug aus dem Check → hat die Edge schon entschieden
  function isVisible(q) {
    return (q.show_if || []).every((a) => {
      if (!a.q) return true;
      if (!st.data.questions.some((x) => x.question_key === a.q)) return true;
      return (st.answers[a.q]?.options || []).some((o) => a.in.includes(o));
    });
  }
  function updateVisibility() {
    st.data.questions.forEach((q) => {
      const el = document.querySelector(`[data-qwrap="${q.question_key}"]`);
      if (el) el.classList.toggle("hidden", !isVisible(q));
    });
  }

  function isAnswered(q) {
    const a = st.answers[q.question_key];
    if (q.type === "text") return true;
    return !!(a && a.options && a.options.length);
  }

  function renderPart(missing = []) {
    const part = st.parts[st.partIdx];
    const qs = st.data.questions.filter((q) => q.part === part);
    const pct = Math.round((st.partIdx / st.parts.length) * 100);
    h(`
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="step-label">Teil ${st.partIdx + 1} von ${st.parts.length}${st.data.editing ? " · Antworten ändern" : ""}</div>
      <h1>${esc(PARTS[part].title)}</h1>
      <p class="lead">${esc(PARTS[part].lead)}</p>
      ${qs.map((q) => renderQuestion(q, missing.includes(q.question_key))).join("")}
      <div class="error" id="err">${missing.length ? "Bitte beantworte noch die markierten Fragen." : ""}</div>
      <div class="row">
        ${st.partIdx > 0 ? '<button class="btn ghost" id="b-back">Zurück</button>' : ""}
        <button class="btn" id="b-next">${st.partIdx === st.parts.length - 1 ? "Auswerten" : "Weiter"}</button>
      </div>`);

    qs.forEach((q) => {
      if (q.type === "text") {
        const ta = document.getElementById("t-" + q.question_key);
        ta.oninput = () => (st.answers[q.question_key] = { text: ta.value });
        return;
      }
      document.querySelectorAll(`[data-q="${q.question_key}"]`).forEach((btn) => {
        btn.onclick = () => {
          const key = btn.dataset.o;
          const cur = new Set(st.answers[q.question_key]?.options || []);
          if (q.type === "single") { cur.clear(); cur.add(key); }
          else if (cur.has(key)) cur.delete(key);
          else {
            if (key === "none") cur.clear(); else cur.delete("none"); // "Nichts davon" schließt den Rest aus
            cur.add(key);
          }
          st.answers[q.question_key] = { options: [...cur] };
          saveDraft();
          document.querySelectorAll(`[data-q="${q.question_key}"]`).forEach((b) => b.classList.toggle("on", cur.has(b.dataset.o)));
          updateVisibility();
        };
      });
    });

    const back = document.getElementById("b-back");
    if (back) back.onclick = () => { st.partIdx--; renderPart(); };
    document.getElementById("b-next").onclick = () => {
      if (REQUIRED_PARTS.includes(part)) {
        const miss = qs.filter((q) => isVisible(q) && !isAnswered(q)).map((q) => q.question_key);
        if (miss.length) return renderPart(miss);
      }
      track("nutri_section_done", { section: part, n: st.partIdx + 1 });
      if (st.partIdx < st.parts.length - 1) { st.partIdx++; saveDraft(); renderPart(); }
      else submit();
    };
  }

  function renderQuestion(q, missing) {
    const cur = new Set(st.answers[q.question_key]?.options || []);
    if (q.type === "text") {
      return `<div class="q ${isVisible(q) ? "" : "hidden"}" data-qwrap="${q.question_key}"><div class="q-label">${esc(q.label)}</div>
        ${q.help ? `<div class="q-help">${esc(q.help)}</div>` : ""}
        <textarea id="t-${q.question_key}" maxlength="500">${esc(st.answers[q.question_key]?.text || "")}</textarea></div>`;
    }
    return `<div class="q ${missing ? "missing" : ""} ${isVisible(q) ? "" : "hidden"}" data-qwrap="${q.question_key}">
      <div class="q-label">${esc(q.label)}</div>
      ${q.help ? `<div class="q-help">${esc(q.help)}</div>` : ""}
      <div class="opts">${q.options.map((o) => `
        <button type="button" class="opt ${q.type === "multi" ? "multi" : ""} ${cur.has(o.key) ? "on" : ""}" data-q="${q.question_key}" data-o="${esc(o.key)}">
          <span class="mark"></span><span>${esc(o.label)}</span></button>`).join("")}</div></div>`;
  }

  async function submit() {
    spinner();
    const hiddenNow = new Set(st.data.questions.filter((q) => !isVisible(q)).map((q) => q.question_key));
    const answers = Object.entries(st.answers).filter(([k]) => !hiddenNow.has(k)).map(([question_key, a]) =>
      a.text != null ? { question_key, value_text: a.text } : { question_key, option_keys: a.options || [] });
    const r = await call("submit", { answers });
    if (!r.success && r.error === "MISSING") {
      // zurück zum ersten Teil mit fehlender Antwort
      const first = st.data.questions.find((q) => r.missing.includes(q.question_key));
      st.partIdx = Math.max(0, st.parts.indexOf(first?.part));
      return renderPart(r.missing);
    }
    if (!r.success) return screenLogin(errorText(r.error));
    clearDraft();
    if (r.status === "excluded") {
      track("nutri_screen_out", { reason: /^med_/.test(r.reason || "") ? "medication" : (r.reason === "scoff" ? "scoff" : (r.reason || "other")) });
      return screenText(r.text, "info");
    }
    if (r.status === "pending_clearance") track("nutri_doctor_flag", { count: (r.result?.shown || []).length });
    track("nutri_complete", {});
    route(r);
  }

  // ── Ergebnis: Potenzialanzeige ──────────────────────────
  function leverCard(l) {
    const tip = l.tip || {};
    const b = tip.benefits || {};
    const label = l.is_top ? "Unser erster Vorschlag" : (l.tier === "also" ? "Ebenfalls möglich" : "Passt auch zu dir");
    const cls = l.is_top ? "t-top" : (l.tier === "also" ? "t-also" : "t-strong");
    const title = l.variant?.title || tip.title || l.lever_key;
    const body = l.variant?.body || tip.body || "";
    const ex = (l.variant?.benefits?.beispiele) || b.beispiele || [];
    return `
      <div class="card ${l.is_top ? "top" : ""}">
        ${l.is_top ? '<img class="buddy" src="assets/buddy-nutrition-128.webp" alt="">' : ""}
        <span class="tier ${cls}">${label}</span>${l.imaginable ? '<span class="imag">✓ kannst du dir vorstellen</span>' : ""}
        <h3>${esc(title)}</h3>
        <p class="lever-body">${esc(body)}</p>
        ${(l.why || []).length ? `<div class="why"><strong>Warum für dich:</strong> Du hast angegeben — ${l.why.map((w) => `${esc(w.topic || "")}${w.topic ? ": " : ""}${esc(w.answer)}`).join(" · ")}</div>` : ""}
        <details ${l.is_top ? "open" : ""}><summary>Warum, woran du es merkst, Beispiele</summary>
          <dl class="kv">
            ${b.warum ? `<dt>Warum</dt><dd>${esc(b.warum)}</dd>` : ""}
            ${b.merkst ? `<dt>Woran du es merkst</dt><dd>${esc(b.merkst)}</dd>` : ""}
            ${b.stolperstein ? `<dt>Typischer Stolperstein</dt><dd>${esc(b.stolperstein)}</dd>` : ""}
            ${ex.length ? `<dt>Beispiele</dt><dd><ul>${ex.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></dd>` : ""}
          </dl>
          <div class="evidence">Studienlage: ${esc(EVIDENCE[l.evidence_level] || "nicht wissenschaftlich untersucht")}</div>
        </details>
        ${st.canChoose ? `<button type="button" class="choose ${st.choice.includes(l.lever_key) ? "on" : ""}" data-choose="${esc(l.lever_key)}">${st.choice.includes(l.lever_key) ? "✓ Damit möchte ich beginnen" : "Damit möchte ich beginnen"}</button>` : ""}
      </div>`;
  }

  function screenResult(r) {
    const res = r.result;
    const shown = res?.shown || [];
    const parking = res?.parking || [];
    st.choice = [...(r.member_choice || [])];
    const intro = isIntroPhase(r);
    // 0.6.0: In der Einführungsphase nach der Bestätigung nur noch ansehen (Nachlegen auf „Deine Schritte“)
    st.canChoose = ["ready", "pending_clearance"].includes(r.status) && shown.length > 0 && !(intro && r.confirmation);
    h(`
      <h1>${esc(r.intro?.title || "Dein Ergebnis")}</h1>
      <p class="lead">${esc(r.intro?.body || "")}${r.intro_tried ? " " + esc(r.intro_tried.body) : ""}</p>
      <p class="muted" style="margin:-8px 0 20px">${shown.length
        ? "Unsere Vorschläge kommen aus deinen Antworten: was in deinem Alltag oft vorkommt und gut untersucht ist. Welche du angehst, entscheidest du."
        : (intro ? "Nach deinen Antworten machst du schon vieles richtig." : "Nach deinen Antworten machst du schon vieles richtig. Im Gespräch schauen wir gemeinsam, wo du trotzdem ansetzen möchtest.")}</p>

      ${r.clearance_text ? `<div class="card warn"><h3>${esc(r.clearance_text.title)}</h3><p class="muted">${esc(r.clearance_text.body)}</p></div>` : ""}
      ${r.bia_text ? `<div class="card info"><h3>${esc(r.bia_text.title)}</h3><p class="muted">${esc(r.bia_text.body)}</p></div>` : ""}

      ${shown.map(leverCard).join("")}

      ${(res?.hints || []).map((hn) => `<div class="card info"><h3>${esc(hn.title)}</h3><p class="muted">${esc(hn.body)}</p></div>`).join("")}

      ${parking.length ? `
        <div class="card">
          <h2>Später, wenn die ersten laufen</h2>
          <p class="muted" style="margin-bottom:8px">${intro ? "Diese Hebel bleiben für dich sichtbar. Sobald ein Schritt im Alltag angekommen ist, kannst du einen davon dazunehmen." : "Diese Hebel bleiben für dich sichtbar. Ab Woche 6 kann einer davon dazukommen."}</p>
          <ul class="parking">${parking.map((l) => `<li><span>${esc(l.tip?.title || l.lever_key)}${l.failed_before ? `<br><span class="tag-failed">${esc(r.failed_text?.body || "Hast du schon einmal probiert.")}</span>` : ""}</span><span class="small">${l.failed_before ? "schon probiert" : (l.tier === "also" ? "ebenfalls möglich" : "passt auch zu dir")}</span></li>`).join("")}</ul>
        </div>` : ""}
      ${st.canChoose ? `<div class="choicebar" id="choicebar"></div>` : ""}

      ${intro ? `
      <div class="card">
        <h2>So geht es weiter</h2>
        <p class="muted"><strong>Starte mit einem Schritt.</strong> Wenn er gut in deinen Alltag passt, nimmst du weitere dazu — höchstens drei gleichzeitig.
          Aus jedem Schritt machst du einen kurzen Plan: <em>„Wenn ich …, dann …“</em>.</p>
        <p class="phase-note" style="margin-top:8px">${esc(INTRO_NOTE)}</p>
      </div>` : `
      <div class="card">
        <h2>So geht es weiter</h2>
        <p class="muted">Im ersten Gespräch suchst du dir gemeinsam mit deinem Trainer oder deiner Trainerin <strong>ein bis drei</strong> dieser Schritte aus —
          welche, entscheidest du. Aus jedem Schritt machen wir einen konkreten Plan: <em>„Wenn ich …, dann …“</em>.
          Dabei buchen wir gleich alle sechs Termine der nächsten zwölf Wochen.</p>
      </div>`}

      <div class="row">
        ${intro && r.confirmation ? '<button class="btn" id="b-steps">Zu deinen Schritten</button>' : ""}
        <button class="btn ghost" id="b-edit">Antworten ändern</button>
      </div>
      ${INTERNAL ? `<p class="small" style="margin-top:14px">Regelwerk ${esc(res?.rules_version)} · ${esc(r.edge_version)} · Status ${esc(r.status)} · Altersstufe ${esc(r.age_stage)}</p>` : ""}`);
    document.getElementById("b-edit").onclick = async () => { spinner(); route(await call("edit")); };
    const bs = document.getElementById("b-steps"); if (bs) bs.onclick = () => screenSteps(r);
    if (st.canChoose) { renderChoiceBar(); bindChoose(); }
    // 0.4.0 — der Konto-Schritt steht jetzt auf der Bestätigungsseite (screenConfirmed)
  }

  // ── Vorauswahl "Damit möchte ich beginnen" (höchstens drei) ─────────
  function renderChoiceBar(msg = "") {
    const el = document.getElementById("choicebar");
    if (!el) return;
    const intro = isIntroPhase();
    const text = msg || (st.choice.length
      ? (intro && st.choice.length === 1 ? "Ein Schritt gewählt — ein guter Start." : `Deine Auswahl: ${st.choice.length} von 3`)
      : (intro ? "Markiere den Vorschlag, mit dem du beginnen möchtest — höchstens drei." : "Markiere bis zu drei Vorschläge, mit denen du beginnen möchtest."));
    el.innerHTML = `<div>${esc(text)}</div>${st.choice.length ? '<button type="button" class="btn" id="b-confirm">Auswahl bestätigen</button>' : ""}`;
    const b = document.getElementById("b-confirm");
    if (b) b.onclick = intro ? confirmIntro : () => screenConfirm(st.data);
  }
  function bindChoose() {
    document.querySelectorAll("[data-choose]").forEach((btn) => {
      btn.onclick = async () => {
        const k = btn.dataset.choose;
        const next = st.choice.includes(k) ? st.choice.filter((x) => x !== k) : [...st.choice, k];
        if (next.length > 3) return renderChoiceBar("Höchstens drei — nimm erst einen anderen Vorschlag heraus.");
        btn.disabled = true;
        const r = await call("choose", { lever_keys: next });
        btn.disabled = false;
        if (!r.success) return renderChoiceBar(errorText(r.error));
        st.choice = r.member_choice || next;
        if (st.data) { st.data.member_choice = st.choice; st.data.confirmation = null; } // neue Auswahl → neu bestätigen
        document.querySelectorAll("[data-choose]").forEach((b) => {
          const on = st.choice.includes(b.dataset.choose);
          b.classList.toggle("on", on);
          b.textContent = on ? "✓ Damit möchte ich beginnen" : "Damit möchte ich beginnen";
        });
        renderChoiceBar();
      };
    });
  }

  // ── 0.4.0 Bestätigung: Auswahl + Weg zum Erstgespräch ──────────────
  const SLOTS = ["vormittags", "nachmittags", "abends"];
  function leverTitle(r, key) {
    const l = [...(r.result?.shown || []), ...(r.result?.parking || [])].find((x) => x.lever_key === key);
    return l?.variant?.title || l?.tip?.title || key;
  }
  function pickedList(r, keys) {
    return `<ul class="picked">${keys.map((k, i) => `<li><span class="num">${i + 1}</span><span>${esc(leverTitle(r, k))}</span></li>`).join("")}</ul>`;
  }

  function screenConfirm(r, msg = "", form = {}) {
    const keys = st.choice.slice(0, 3);
    if (!keys.length) return screenResult(r);
    const f = { way: "", first_name: r.prefill?.first_name || "", phone: "", slot: "", consent: false, training: !!r.movement?.low, ...form };
    h(`
      <h1>Deine Auswahl</h1>
      <p class="lead">Mit diesen Schritten möchtest du beginnen. Im Erstgespräch machst du mit deinem Trainer oder deiner Trainerin
        aus jedem einen konkreten Plan — ändern kannst du die Auswahl dort noch.</p>
      <div class="card">${pickedList(r, keys)}</div>
      ${r.clearance_text ? `<div class="card warn"><h3>${esc(r.clearance_text.title)}</h3><p class="muted">${esc(r.clearance_text.body)}</p></div>` : ""}
      <h2>Wie kommen wir zusammen?</h2>
      <label class="way ${f.way === "callback" ? "on" : ""}"><input type="radio" name="way" value="callback" ${f.way === "callback" ? "checked" : ""}>
        <span><strong>Ruft mich an</strong><span class="muted">Wir melden uns zur Terminabsprache für dein Erstgespräch.</span></span></label>
      <label class="way ${f.way === "self" ? "on" : ""}"><input type="radio" name="way" value="self" ${f.way === "self" ? "checked" : ""}>
        <span><strong>Ich melde mich selbst</strong><span class="muted">Du bekommst unsere Telefonnummer und Öffnungszeiten.</span></span></label>
      <div class="card ${f.way === "callback" ? "" : "hidden"}" id="cb-form" style="margin-top:8px">
        <div class="field"><label for="cb-name">Vorname</label><input type="text" id="cb-name" maxlength="60" autocomplete="given-name" value="${esc(f.first_name)}"></div>
        <div class="field"><label for="cb-phone">Telefon</label><input type="tel" id="cb-phone" maxlength="25" autocomplete="tel" placeholder="0170 …" value="${esc(f.phone)}"></div>
        <div class="field"><label>Wann passt es dir am besten?</label>
          <div class="slots">${SLOTS.map((s) => `<label class="${f.slot === s ? "on" : ""}"><input type="radio" name="slot" value="${s}" ${f.slot === s ? "checked" : ""}>${s}</label>`).join("")}</div></div>
        <label class="consent-box"><input type="checkbox" id="cb-consent" ${f.consent ? "checked" : ""}><span>LeVITA darf mich zur Terminabsprache anrufen.</span></label>
        <label class="consent-box"><input type="checkbox" id="cb-training" ${f.training ? "checked" : ""}><span>Ich interessiere mich auch für betreutes Training oder ein Probetraining. <span class="small">Freiwillig.</span></span></label>
      </div>
      <div class="error" id="err">${esc(msg)}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="b-back">Zurück</button>
        <button class="btn" id="b-send">Auswahl bestätigen</button>
      </div>`);
    const read = () => ({
      way: document.querySelector('input[name="way"]:checked')?.value || "",
      first_name: document.getElementById("cb-name").value.trim().slice(0, 60),
      phone: document.getElementById("cb-phone").value.trim(),
      slot: document.querySelector('input[name="slot"]:checked')?.value || "",
      consent: document.getElementById("cb-consent").checked,
      training: document.getElementById("cb-training").checked,
    });
    document.querySelectorAll('input[name="way"]').forEach((i) => (i.onchange = () => {
      document.querySelectorAll(".way").forEach((w) => w.classList.toggle("on", w.querySelector("input").checked));
      document.getElementById("cb-form").classList.toggle("hidden", i.value !== "callback" || !i.checked);
    }));
    document.querySelectorAll('input[name="slot"]').forEach((i) => (i.onchange = () =>
      document.querySelectorAll(".slots label").forEach((l) => l.classList.toggle("on", l.querySelector("input").checked))));
    document.getElementById("b-back").onclick = () => screenResult(r);
    document.getElementById("b-send").onclick = async () => {
      const v = read();
      const err = (code) => (document.getElementById("err").textContent = errorText(code));
      if (!v.way) return err("CONTACT_WAY");
      if (v.way === "callback") {
        if (!v.first_name) return err("FIRST_NAME");
        if (!/^[+0-9][0-9 ()\/-]{5,24}$/.test(v.phone)) return err("PHONE");
        if (!SLOTS.includes(v.slot)) return err("SLOT");
        if (!v.consent) return err("CONSENT_CONTACT");
      }
      spinner();
      const res = await call("confirm_choice", {
        lever_keys: keys, contact_way: v.way,
        ...(v.way === "callback" ? { first_name: v.first_name, phone: v.phone, preferred_slot: v.slot, consent_contact: true, interest_training: v.training } : {}),
      });
      if (!res.success) {
        if (["PIN_INVALID", "LOCKED", "PIN_REQUIRED", "NOT_FOUND"].includes(res.error)) return screenLogin(errorText(res.error));
        return screenConfirm(r, errorText(res.error), v);
      }
      st.data = res;
      screenConfirmed(res);
    };
  }

  // ── 0.6.0 Einführungsphase: Bestätigen ohne Gesprächsweg ─────────
  async function confirmIntro() {
    const keys = st.choice.slice(0, 3);
    if (!keys.length) return;
    spinner();
    const r = await call("confirm_choice", { lever_keys: keys });
    if (!r.success) {
      if (["PIN_INVALID", "LOCKED", "PIN_REQUIRED", "NOT_FOUND"].includes(r.error)) return screenLogin(errorText(r.error));
      return screenResult({ ...st.data });
    }
    st.data = r;
    keys.forEach((k) => track("nutri_step_state", { step_key: k, state: "vorgemerkt" }));
    screenSteps(r);
  }

  const STATE_LABEL = { vorgemerkt: ["Vorgemerkt", "s-v"], gestartet: ["Gestartet", "s-g"], angekommen: ["Im Alltag angekommen", "s-a"] };
  const HELP = [["gespraech", "Persönliches Gespräch"], ["rueckmeldung", "Regelmäßige Rückmeldung"], ["koerperanalyse", "Körperanalyse"],
    ["plan", "Individueller Plan"], ["erinnerung", "Erinnerung"], ["keine", "Keine zusätzliche Unterstützung"]];

  // 1.1.0 (24.10.2026): Wenn-dann-Plan in zwei Feldern mit Anleitung und Begründung.
  // Quelle: Gollwitzer, P. M. & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis
  // of effects and processes. Advances in Experimental Social Psychology, 38, 69–119 (94 Studien, d = 0,65).
  function splitIfThen(t) {
    const m = String(t || "").match(/^\s*wenn\s+(.+?),?\s+dann\s+(.+?)\.?\s*$/i);
    return m ? [m[1], m[2]] : ["", ""];
  }
  function ifThenFields(key, prefill = "") {
    const [w, d] = splitIfThen(prefill);
    return `<div class="field">
        <label>Dein Plan in zwei Teilen</label>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><strong style="min-width:48px">Wenn</strong><input type="text" style="flex:1" id="itw-${esc(key)}" maxlength="140" value="${esc(w)}" placeholder="ich freitags nach der Arbeit nach Hause komme,"></div>
        <div style="display:flex;gap:10px;align-items:center"><strong style="min-width:48px">dann</strong><input type="text" style="flex:1" id="itd-${esc(key)}" maxlength="140" value="${esc(d)}" placeholder="stelle ich mir eine Schorle kalt statt eines Biers."></div>
      </div>
      <details class="small" style="margin:2px 0 12px"><summary style="cursor:pointer;font-weight:600">So geht's – und warum es hilft</summary>
        <p style="margin:8px 0 6px"><strong>Wenn:</strong> eine Situation, die in deiner Woche sicher vorkommt – mit Zeitpunkt oder Ort, z. B. „Wenn ich mittags in die Kantine gehe“. <strong>Dann:</strong> ein Handgriff, den du genau in diesem Moment tun kannst, z. B. „nehme ich zuerst den Salat“. Kein Vorsatz wie „weniger essen“ oder „fitter werden“, sondern etwas, das man von außen sehen könnte.</p>
        <p style="margin:0"><strong>Warum:</strong> Ein Vorsatz allein muss im entscheidenden Moment erst wieder einfallen und neu entschieden werden – oft dann, wenn man müde oder abgelenkt ist. Mit einem Wenn-dann-Plan triffst du die Entscheidung vorher; die Situation erinnert dich dann von selbst an die Handlung. In einer Auswertung von 94 Studien erreichten Menschen mit solchen Plänen ihre Ziele deutlich häufiger als mit einem Vorsatz allein (Gollwitzer &amp; Sheeran, 2006).</p>
      </details>`;
  }
  function readIfThen(key) {
    const clean = (s, re) => String(s || "").trim().replace(re, "").replace(/[.,;:]+$/, "").trim();
    const w = clean(document.getElementById("itw-" + key)?.value, /^wenn\s+/i);
    const d = clean(document.getElementById("itd-" + key)?.value, /^dann\s+/i);
    return (w.length >= 3 && d.length >= 3) ? `Wenn ${w}, dann ${d}.` : "";
  }

  function stepCard(r, x) {
    const [lbl, cls] = STATE_LABEL[x.state] || [x.state, "s-v"];
    const needDoc = r.doctor_required && !r.doctor_confirmed_at;
    const tip = [...(r.result?.shown || []), ...(r.result?.parking || [])].find((l) => l.lever_key === x.lever_key)?.tip || {};
    const ex = (tip.benefits?.beispiele || []).slice(0, 2);
    return `<div class="card ${x.state === "angekommen" ? "top" : ""}" data-step="${esc(x.lever_key)}">
      <span class="state ${cls}">${lbl}</span>
      <h3>${esc(leverTitle(r, x.lever_key))}</h3>
      ${(r.result?.step_hints || r.result?.hints || []).filter((hn) => hn.lever_key === x.lever_key).map((hn) => `<p class="muted" style="border-left:3px solid var(--accent-blue);padding-left:10px;margin:6px 0 10px"><strong>${esc(hn.title)}</strong><br>${esc(hn.body)}</p>`).join("")}
      ${x.state === "vorgemerkt" ? `
        ${needDoc ? `<p class="muted" style="color:var(--accent-amber-text);margin-bottom:8px">Vor Umsetzung ärztlich klären.</p>` : ""}
        ${ifThenFields(x.lever_key)}
        ${ex.length ? `<div class="small" style="margin:-4px 0 10px">Beispiele zu diesem Schritt: ${ex.map(esc).join(" · ")}</div>` : ""}
        ${needDoc ? `<label class="consent-box"><input type="checkbox" id="dc-${esc(x.lever_key)}"><span>Ich habe die Tipps mit meiner Ärztin oder meinem Arzt besprochen. <span class="small">Das ist meine eigene Angabe, keine medizinische Freigabe.</span></span></label>` : ""}
        <div class="row"><button class="btn" data-act="start">Schritt starten</button><button class="btn ghost" data-act="unmark">Herausnehmen</button></div>`
      : `<div class="ifthen">${esc(x.if_then_text || "")}</div>
        ${x.state === "gestartet" ? `<details class="small" style="margin:-4px 0 12px" ${needsAdjust(r, x) ? "open" : ""}><summary style="cursor:pointer;font-weight:600">Plan anpassen</summary><div style="margin-top:10px">${ifThenFields(x.lever_key, x.if_then_text)}<button class="btn ghost" data-act="start">Plan speichern</button></div></details>` : ""}
        <div class="row">${x.state === "gestartet"
          ? '<button class="btn" data-act="arrive">Klappt inzwischen meistens</button><button class="btn ghost" data-act="unmark">Herausnehmen</button>'
          : '<button class="btn ghost" data-act="back">Klappt doch noch nicht</button>'}</div>`}
      <div class="error" data-err></div>
    </div>`;
  }

  function screenSteps(r, msg = "") {
    st.data = r;
    const steps = r.self_steps || [];
    const active = steps.filter((x) => x.state !== "angekommen").length;
    const max = r.max_active_steps || 3;
    const chosen = new Set(steps.map((x) => x.lever_key));
    const more = [...(r.result?.shown || []), ...(r.result?.parking || [])].filter((l) => !chosen.has(l.lever_key) && !l.failed_before);
    const needDoc = r.doctor_required && !r.doctor_confirmed_at;
    const fbDone = r.feedback_given;
    h(`
      <h1>Deine Schritte</h1>
      <p class="lead">${steps.some((x) => x.state !== "vorgemerkt")
        ? "Hake ab, was im Alltag angekommen ist — dann kannst du nachlegen."
        : "Mach aus deinem Schritt einen kurzen Plan und starte. Ein Schritt, der hält, bringt mehr als drei, die nach zwei Wochen wegbrechen."}</p>
      ${msg ? `<div class="card warn"><p>${esc(msg)}</p></div>` : ""}
      ${needDoc && r.clearance_text ? `<div class="card warn"><h3>${esc(r.clearance_text.title)}</h3><p class="muted">${esc(r.clearance_text.body)}</p></div>` : ""}
      ${kurzcheckHtml(r)}
    ${steps.map((x) => stepCard(r, x)).join("") || '<div class="card"><p class="muted">Noch kein Schritt gewählt.</p></div>'}
      ${steps.some((x) => x.state !== "vorgemerkt") ? `
      <div class="card">
        <h2>Wie es weitergeht</h2>
        <p class="muted" style="margin-bottom:8px"><strong>Die nächsten zwei Wochen:</strong> Setz deine Pläne im Alltag um. Der Kühlschrank-Zettel weiter unten hilft dir beim Abhaken.</p>
        <p class="muted" style="margin-bottom:8px"><strong>Danach kommst du zurück</strong> – ${r.account?.in_account || st.acct ? 'über <a href="konto.html">Mein Bereich</a>' : "über Mein Bereich, wenn du unten ein Konto anlegst, sonst auf dieser Seite mit Pilot-ID und PIN"} – zum Kurzcheck und schätzt jeden Schritt mit einem Klick ein: klappt meistens, teilweise oder noch nicht. Was noch hakt, passt du an oder nimmst es heraus.</p>
        <p class="muted" style="margin:0"><strong>Dann setzt du neue Ziele:</strong> Für jeden Schritt, der angekommen ist, kannst du einen neuen dazunehmen – höchstens drei gleichzeitig.</p>
      ${checkinInfoHtml(r)}
      </div>` : ""}

      ${steps.some((x) => x.state !== "vorgemerkt") ? `
      <div class="card">
        <h2>Zettel für den Kühlschrank</h2>
        <p class="muted">Deine Pläne auf einer Seite, mit Abhakleiste für zwei Wochen. Im Druckdialog kannst du ihn auch als PDF speichern.</p>
        <button class="btn ghost block" id="b-fridge" style="margin-top:10px">Zettel drucken</button>
      </div>` : ""}

      ${more.length ? `
      <div class="card">
        <h2>${active >= max ? "Später nachlegen" : "Weitere Schritte"}</h2>
        <p class="muted" style="margin-bottom:8px">${active >= max
          ? `Du hast ${max} Schritte gleichzeitig. Sobald einer im Alltag angekommen ist, kannst du einen dieser dazunehmen.`
          : "Wenn dein Schritt gut läuft, nimm einen dazu — höchstens " + max + " gleichzeitig."}</p>
        <ul class="addlist">${more.slice(0, 8).map((l) => `<li><span>${esc(l.variant?.title || l.tip?.title || l.lever_key)}</span>${active < max ? `<button data-add="${esc(l.lever_key)}">Dazunehmen</button>` : ""}</li>`).join("")}</ul>
      </div>` : ""}

      ${fbDone ? "" : `
      <div class="card" id="fb">
        <h2>Deine Rückmeldung</h2>
        <p class="muted">Wie hilfreich waren die Vorschläge für dich?</p>
        <div class="rate">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-rate="${n}">${n}</button>`).join("")}</div>
        <p class="muted">Was würde dir am meisten helfen, deine Ziele umzusetzen?</p>
        <div class="chips">${HELP.map(([k, t]) => `<button type="button" data-help="${k}">${esc(t)}</button>`).join("")}</div>
        <div class="field"><label for="fb-text">Was hat dir gefehlt?</label><textarea id="fb-text" maxlength="1000"></textarea></div>
        <button class="btn block" id="b-fb">Rückmeldung senden</button>
        <div class="error" id="fb-err"></div>
      </div>`}

      <div class="card" id="pi">${programHtml(r)}</div>

      ${isDemo() || r.account?.in_account || st.acct ? "" : `<h2 style="margin-top:6px">Deine Schritte speichern</h2>
        <p class="muted" id="konto-hint">Freiwillig.</p>`}
      <div id="konto-step"></div>

      <div class="card"><h3>Lieber mit Unterstützung?</h3><p class="muted" style="margin-bottom:6px">Wer möchte, kann im Studio ein Gespräch vereinbaren.</p>${contactHtml(r.studio_contact)}</div>
      <div class="row"><button class="btn ghost" id="b-all">Alle Vorschläge ansehen</button></div>
      <p class="phase-note" style="margin-top:14px;text-align:center">${esc(INTRO_NOTE)} Danach bieten wir den Ernährungs-Check mit persönlicher Begleitung im Studio an.</p>
      ${INTERNAL ? `<p class="small" style="margin-top:14px">${esc(r.edge_version)} · Status ${esc(r.status)} · Arzt bestätigt ${esc(r.doctor_confirmed_at || "–")}</p>` : ""}`);

    // Schritte
    document.querySelectorAll("[data-step]").forEach((card) => {
      const key = card.dataset.step;
      card.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
        const action = b.dataset.act;
        const extra = { lever_key: key, action };
        const wasMarked = (steps.find((s) => s.lever_key === key) || {}).state === "vorgemerkt"; // 1.2.0
        if (action === "start") {
          extra.if_then = readIfThen(key); // 1.1.0
          if (!extra.if_then) { card.querySelector("[data-err]").textContent = errorText("IF_THEN"); return; }
          const dc = document.getElementById("dc-" + key);
          if (dc) extra.doctor_confirmed = dc.checked;
        }
        b.disabled = true;
        const res = await call("step", extra);
        b.disabled = false;
        if (!res.success) { card.querySelector("[data-err]").textContent = errorText(res.error); return; }
        const newState = { start: "gestartet", arrive: "angekommen", back: "gestartet", unmark: "beendet" }[action];
        track("nutri_step_state", { step_key: key, state: newState, doctor_confirmed: action === "start" ? !!extra.doctor_confirmed : undefined });
        // 1.2.0: letzter vorgemerkter Schritt gestartet → Abschluss-Fenster
        if (action === "start" && wasMarked && !(res.self_steps || []).some((s) => s.state === "vorgemerkt")) { screenSteps(res); return openRoundModal(res); }
        screenSteps(res);
      });
    });
    document.querySelectorAll("[data-add]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      const res = await call("step", { lever_key: b.dataset.add, action: "add" });
      if (!res.success) return screenSteps(r, errorText(res.error));
      track("nutri_step_state", { step_key: b.dataset.add, state: "vorgemerkt", origin: "nachgelegt" });
      screenSteps(res);
    });
    // Kühlschrank-Zettel
    const bf = document.getElementById("b-fridge");
    if (bf) bf.onclick = () => {
      renderFridge(r);
      call("fridge").catch(() => {});
      track("nutri_fridge_note", { action: "print", steps_count: steps.filter((x) => x.state !== "vorgemerkt").length });
      const imgs = [...document.querySelectorAll("#fridge img")];
      Promise.all(imgs.map((i) => (i.decode ? i.decode().catch(() => {}) : null))).then(() => setTimeout(() => window.print(), 50));
    };
    // Feedback
    if (!fbDone) {
      let rating = null; const help = new Set();
      document.querySelectorAll("[data-rate]").forEach((b) => b.onclick = () => {
        rating = Number(b.dataset.rate);
        document.querySelectorAll("[data-rate]").forEach((x) => x.classList.toggle("on", x === b));
      });
      document.querySelectorAll("[data-help]").forEach((b) => b.onclick = () => {
        const k = b.dataset.help;
        if (help.has(k)) help.delete(k); else { if (k === "keine") help.clear(); else help.delete("keine"); help.add(k); }
        document.querySelectorAll("[data-help]").forEach((x) => x.classList.toggle("on", help.has(x.dataset.help)));
      });
      document.getElementById("b-fb").onclick = async () => {
        const text = document.getElementById("fb-text").value.trim();
        const res = await call("feedback", { rating, help_options: [...help], missing_text: text });
        if (!res.success) return (document.getElementById("fb-err").textContent = errorText(res.error));
        track("nutri_feedback", { rating, help_options: [...help].join(","), has_freetext: !!text });
        document.getElementById("fb").innerHTML = '<h2>Danke für deine Rückmeldung</h2><p class="muted">Sie hilft uns, den Ernährungs-Check besser zu machen.</p>';
        st.data.feedback_given = true;
      };
    }
    bindProgram(r);
    bindKurzcheck(r); // 1.2.0
    document.getElementById("b-all").onclick = () => screenResult(r);
    // Konto freiwillig (konto.js 1.1.0 ohne required → mit „Ohne Konto weiter“)
    if (window.LeVitaKonto && !isDemo() && st.pin && !r.account?.in_account) {
      window.LeVitaKonto.mountStep(document.getElementById("konto-step"), {
        publicCode: st.code, pin: st.pin, context: "nutrition", required: false,
        lead: "Mit Konto bleiben deine Schritte gespeichert, und wir erinnern dich an deinen Kurzcheck. Du öffnest alles ohne PIN, mit einem Link per E-Mail.",
        onRequested: () => { track("nutri_account", { action: "requested" }); const hn = document.getElementById("konto-hint"); if (hn) hn.textContent = "Bitte bestätige den Link in deiner Mail innerhalb einer Stunde — erst dann ist dein Konto aktiv. Danach bleibt das Gerät angemeldet, auf dem du den Link öffnest."; },
      });
      document.getElementById("konto-step").addEventListener("click", (ev) => { if (ev.target && ev.target.id === "lk-skip") track("nutri_account", { action: "skipped" }); });
    }
  }

  // ── 1.2.0 (25.10.2026): Kurzcheck nach 14 Tagen ──────────────────────
// Abschluss-Fenster „Deine nächsten 14 Tage“ (Pläne, Zettel, Kalender, Erinnerung nur mit Einwilligung),
// Kurzcheck-Karte mit drei Antworten je Schritt, Link aus der Erinnerungsmail ohne PIN (30 Tage gültig).
const KURZ_LABEL = { meistens: "Klappt meistens", teilweise: "Klappt teilweise", noch_nicht: "Klappt noch nicht" };
const KURZ_OUTCOME = {
  meistens: "Im Alltag angekommen. Du kannst jetzt einen neuen Schritt dazunehmen.",
  teilweise: "Ein Anfang. Schau dir unten bei „Plan anpassen“ an: Kommt die Wenn-Situation wirklich jede Woche vor? Ist das Dann klein genug?",
  noch_nicht: "Passiert. Mach den Plan kleiner oder einfacher – oder nimm den Schritt heraus und wähle einen anderen.",
};
const fmtDay = (d) => new Date(d).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
function ratedThisRound(r, x) {
  if (!x.rated_at || !x.last_rating) return false;
  const start = r.checkin && r.checkin.started_at ? new Date(r.checkin.started_at).getTime() : 0;
  return new Date(x.rated_at).getTime() >= start;
}
function needsAdjust(r, x) {
  return x.state === "gestartet" && ["teilweise", "noch_nicht"].includes(x.last_rating) && ratedThisRound(r, x);
}
function kurzcheckDue(r) {
  const c = r.checkin;
  return st.fromLink || !!(c && new Date(c.due_at).getTime() <= Date.now());
}
function kurzcheckHtml(r) {
  if (!kurzcheckDue(r)) return "";
  const steps = (r.self_steps || []).filter((x) => x.state === "gestartet" || (x.state === "angekommen" && ratedThisRound(r, x)));
  if (!steps.length) return "";
  const allRated = steps.every((x) => ratedThisRound(r, x));
  return `<div class="card top" id="kurzcheck">
    <h2>Dein Kurzcheck</h2>
    <p class="muted" style="margin-bottom:10px">Zwei Wochen sind um. Wie laufen deine Schritte? Ein Klick pro Schritt.</p>
    ${steps.map((x) => {
      const done = ratedThisRound(r, x);
      return `<div style="border-top:1px solid var(--border, rgba(127,127,127,.25));padding:12px 0 4px">
        <strong>${esc(leverTitle(r, x.lever_key))}</strong>
        ${x.if_then_text ? `<div class="small" style="margin:2px 0 8px">${esc(x.if_then_text)}</div>` : ""}
        <div class="row" style="flex-wrap:wrap;gap:8px;margin:0">${Object.keys(KURZ_LABEL).map((k) =>
          `<button type="button" class="btn ${done && x.last_rating === k ? "" : "ghost"}" style="padding:9px 14px;font-size:14px;white-space:nowrap;width:auto;min-height:0" data-krate="${esc(x.lever_key)}|${k}">${KURZ_LABEL[k]}</button>`).join("")}</div>
        ${done ? `<p class="muted" style="margin:8px 0 0">${esc(KURZ_OUTCOME[x.last_rating] || "")}</p>` : ""}

function icsHref(dueDate) {

  const next = new Date(d.getTime() + 864e5);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const url = `https://app.le-vita.com/ernaehrung.html?code=${encodeURIComponent(st.code || "")}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//LeVITA//Ernaehrungs-Check//DE", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:kurzcheck-${ymd(d)}-${(st.code || "x").replace(/[^A-Z0-9-]/gi, "")}@le-vita.com`, `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${ymd(d)}`, `DTEND;VALUE=DATE:${ymd(next)}`,
    "SUMMARY:Kurzcheck Ernährungs-Check", `DESCRIPTION:Wie laufen deine Schritte? Pro Schritt ein Klick: ${url}`, `URL:${url}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

  </div>`;

}
function bindKurzcheck(r) {
  document.querySelectorAll("[data-krate]").forEach((b) => b.onclick = async () => {
    const [key, rating] = b.dataset.krate.split("|");

    b.disabled = false;
    if (!res.success) { const el = document.querySelector(`[data-kerr="${key}"]`); if (el) el.textContent = errorText(res.error); return; }
    track("nutri_checkin_rate", { step_key: key, rating, via: st.ctoken ? "mail" : "page" });
    screenSteps(res);
    const k = document.getElementById("kurzcheck"); if (k) k.scrollIntoView({ block: "start" });
  });

}

  // Bestätigungslink aus der Mail „Info zum Programm“
  async function screenProgramConfirm(token) {
    spinner();
    const res = await call("program_confirm", { token });
    if (res.success) track("nutri_program_interest", { confirmed: true });
    h(res.success
      ? `<div class="card top"><h2>Danke${res.first_name ? ", " + esc(res.first_name) : ""}!</h2><p>Bestätigt. Sobald das 12-Wochen-Programm mit persönlicher Begleitung startet, schreiben wir dir.</p></div>`
      : `<div class="card warn"><h2>Das hat nicht geklappt</h2><p class="muted">${res.error === "EXPIRED" ? "Der Link ist abgelaufen. Fordere ihn im Ernährungs-Check einfach neu an." : "Der Link ist ungültig oder wurde schon verwendet."}</p></div>`);
  }

  function contactHtml(c) {
    const phone = c?.phone ? String(c.phone) : "";
    const tel = phone.replace(/[^+0-9]/g, "");
    const hours = Array.isArray(c?.hours) ? c.hours : [];
    if (!phone && !hours.length) {
      return `<p class="muted">Sprich uns beim nächsten Besuch im Studio an${c?.email ? ` oder schreib uns an <a href="mailto:${esc(c.email)}" style="color:var(--accent-green-text)">${esc(c.email)}</a>` : ""} — wir vereinbaren dann dein Erstgespräch.</p>`;
    }
    return `${phone ? `<p class="contact-line">Telefon: <a href="tel:${esc(tel)}">${esc(phone)}</a></p>` : ""}
      ${hours.length ? `<p class="contact-line">Öffnungszeiten:</p><ul class="kv" style="margin-top:4px">${hours.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${c?.email ? `<p class="contact-line">Mail: <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>` : ""}`;
  }

  function movementHtml(m) {
    if (!m?.intro) return "";
    return `<div class="card">
        <h2>${esc(m.intro.title)}</h2>
        <p class="muted">${esc(m.intro.body)}${m.strength ? ` In deinem Vital-Check hast du beim Krafttraining „${esc(m.strength)}“ angegeben.` : ""}</p>
        <div class="move-grid">
          ${m.alone ? `<div><h3>${esc(m.alone.title)}</h3><p class="muted">${esc(m.alone.body)}</p></div>` : ""}
          ${m.studio ? `<div><h3>${esc(m.studio.title)}</h3><p class="muted">${esc(m.studio.body)}</p></div>` : ""}
        </div>
      </div>`;
  }

  function screenConfirmed(r) {
    const cf = r.confirmation || {};
    const keys = cf.lever_keys || r.member_choice || [];
    st.choice = [...keys];
    const cb = cf.callback;
    h(`
      <h1>Deine Auswahl steht</h1>
      <p class="lead">${keys.length === 1 ? "Mit diesem Schritt" : "Mit diesen Schritten"} startest du. Im Erstgespräch macht dein Trainer oder deine Trainerin
        mit dir aus jedem einen Plan: <em>„Wenn ich …, dann …“</em> — und ihr bucht gleich alle Termine der nächsten zwölf Wochen.</p>
      <div class="card top">${pickedList(r, keys)}</div>
      ${isDemo() ? `<div class="card info"><h3>Letzter Schritt: dein Konto</h3><p class="muted">Hier legt die Person ihr persönliches Konto an (Pflicht für die Begleitung, Link per Mail). Bei Demo-Profilen wird dieser Schritt nicht angezeigt.</p></div>` : r.account?.in_account ? "" : `<h2 style="margin-top:6px">Letzter Schritt: dein Konto</h2>
        <p class="muted" id="konto-hint">Für die Begleitung im Studio brauchst du ein persönliches Konto. Wir schicken dir dafür einen Link per Mail.</p>`}
      <div id="konto-step"></div>
      ${r.movement?.low ? movementHtml(r.movement) : ""}
      ${r.clearance_text ? `<div class="card warn"><h3>${esc(r.clearance_text.title)}</h3><p class="muted">${esc(r.clearance_text.body)}</p></div>` : ""}
      ${cf.contact_preference === "callback" ? `
        <div class="card info"><h3>Wir rufen dich an</h3>
          <p class="muted">Deine Rückrufbitte ist bei uns${cb?.preferred_slot ? ` — am liebsten ${esc(cb.preferred_slot)}` : ""}. Wir melden uns, um dein Erstgespräch zu vereinbaren.</p></div>` : `
        <div class="card info"><h3>So erreichst du uns</h3>${contactHtml(r.studio_contact)}</div>`}
      ${r.movement?.low ? "" : movementHtml(r.movement)}
      <p class="muted" style="margin:4px 0 12px">Nach deinem Erstgespräch findest du deinen Plan in deinem persönlichen Bereich und kannst ihn dir dort per Mail schicken.</p>
      <div class="row">
        <button class="btn ghost" id="b-change">Auswahl ändern</button>
        <button class="btn ghost" id="b-all">Alle Vorschläge ansehen</button>
      </div>
      ${INTERNAL ? `<p class="small" style="margin-top:14px">Bestätigt ${esc(cf.confirmed_at)} · ${esc(r.edge_version)} · Status ${esc(r.status)}</p>` : ""}`);
    const toResult = () => screenResult({ ...r, member_choice: keys });
    document.getElementById("b-change").onclick = toResult;
    document.getElementById("b-all").onclick = toResult;
    // Konto-Schritt (Stufe 3): die PIN bleibt im Speicher dieser Seite und geht nur an die Edge
    // 0.5.0: Pflicht (required) — kein "Ohne Konto weiter"; die PIN bleibt im Speicher dieser Seite
    if (window.LeVitaKonto && !isDemo()) window.LeVitaKonto.mountStep(document.getElementById("konto-step"), {
      publicCode: st.code, pin: st.pin, context: "nutrition", required: true,
      onRequested: () => { const hn = document.getElementById("konto-hint"); if (hn) hn.textContent = "Bitte bestätige den Link in deiner Mail innerhalb einer Stunde — erst dann ist dein Konto aktiv. Danach bleibt das Gerät angemeldet, auf dem du den Link öffnest."; },
    });
  }

  // ── Testmodus ───────────────────────────────────────────
  function showRaw(mode, json) {
    if (!INTERNAL) return;
    document.getElementById("tb-version").textContent = `Frontend ${FE_VERSION} · ${json.edge_version || "Edge ?"} · letzter Aufruf: ${mode} (HTTP ${json._http})`;
    document.getElementById("raw").textContent = JSON.stringify(json, null, 2);
  }
  if (INTERNAL) {
    document.getElementById("testbar").classList.remove("hidden");
    document.getElementById("tb-raw").onclick = () => document.getElementById("raw").classList.toggle("hidden");
    document.getElementById("tb-fill").onclick = () => {
      if (!st.data?.questions) return alert("Zufallsantworten gibt es nur im Fragebogen.");
      const allowExcl = document.getElementById("tb-excl").checked;
      const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
      for (const q of st.data.questions) {
        const keys = q.options.map((o) => o.key);
        if (q.type === "text") { st.answers[q.question_key] = { text: Math.random() < .5 ? "Testantwort" : "" }; continue; }
        if (q.part === "S" && !allowExcl) {
          // unauffällig: "Nein"/"Nichts davon"/erste Option; Medikation gelegentlich mit Freigabe-Fall
          let pick = keys.includes("none") ? "none" : keys.includes("no") ? "no" : keys[0];
          if (q.question_key === "s_medications" && Math.random() < .25) pick = rnd(["levothyroxin", "blutdruck", "statine"]);
          if (q.question_key === "s_strength_intent") pick = rnd(["trains", "start"]);
          st.answers[q.question_key] = { options: [pick] };
          continue;
        }
        if (q.type === "multi") {
          const pool = keys.filter((k) => k !== "none");
          const n = Math.floor(Math.random() * 3);
          const set = new Set(); while (set.size < n && set.size < pool.length) set.add(rnd(pool));
          st.answers[q.question_key] = { options: set.size ? [...set] : (keys.includes("none") ? ["none"] : []) };
        } else st.answers[q.question_key] = { options: [rnd(keys)] };
      }
      st.partIdx = st.parts.length - 1;
      renderPart();
      updateVisibility();
    };
  }

  // ── Los ─────────────────────────────────────────────────
  // 0.6.0: Bestätigungslink → eigene Seite; mit Konto-Login direkt ohne PIN; sonst Pilot-ID + PIN
  (async () => {
    const prog = params.get("programm");
    if (prog) return screenProgramConfirm(prog);
    // 1.2.0: Kurzcheck-Link und Abmelden aus der Erinnerungsmail
    const kab = params.get("kurzcheck_ab");
    if (kab) return screenCheckinOptout(kab);
    const kc = params.get("kurzcheck");
    if (kc) return startFromCheckinLink(kc);
    track("nutri_view", { has_code: !!st.code }, true);   // 0.6.4: Aufruf der Seite (vor Anmeldung)
    if (st.code && window.LeVitaKonto && !isDemo()) {
      try {
        const ss = await window.LeVitaKonto.session();
        if (ss && ss.access_token) {
          st.acct = ss.access_token;
          spinner();
          const r = await call("start");
          if (r.success) { track("nutri_start", { via: "account" }, true); return route(r); }
          st.acct = null;
        }
      } catch (e) { st.acct = null; }
    }
    screenLogin();
  })();
})();
</script>
