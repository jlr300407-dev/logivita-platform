<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gutschein einlösen | LeVita Empfang</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/levita-bildmarke.png">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
:root{--braun:#482922;--braun-hell:#745E3D;--gruen:#A6D71C;--beige:#E8E0D0;--creme:#F6F2EA}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--braun);font-family:'Barlow',system-ui,sans-serif;font-size:17px}
header{background:#fff;border-bottom:1px solid var(--beige)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
header img{height:40px;display:block}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;margin:28px 0 6px}
p.sub{margin:0 0 22px;color:var(--braun-hell)}
.karte{background:#fff;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
input{width:100%;min-height:50px;padding:0 14px;border:2px solid var(--beige);border-radius:10px;font:inherit;color:var(--braun)}
input.code{font-size:26px;letter-spacing:3px;text-transform:uppercase;font-family:'Courier New',monospace;font-weight:700}
input:focus-visible,button:focus-visible{outline:3px solid var(--gruen);outline-offset:2px}
button{min-height:52px;border:none;border-radius:12px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;padding:0 22px}
.primaer{background:var(--gruen);color:var(--braun)}
.sekundaer{background:var(--braun);color:#fff}
.leise{background:transparent;color:var(--braun-hell);min-height:40px;font-size:15px;text-decoration:underline;padding:0}
button:disabled{opacity:.55;cursor:default}
.zeile{display:flex;gap:10px;flex-wrap:wrap}
.zeile input{flex:1 1 240px}
.meldung{border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.45}
.gut{background:#EEF7D4;border:2px solid var(--gruen)}
.warn{background:#FBEDE8;color:#8A2A12}
.info{background:var(--creme)}
.gewinn{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1.1}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dt{color:var(--braun-hell)}dd{margin:0;font-weight:600}
.tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.tab{background:#fff;color:var(--braun);border:2px solid var(--beige);min-height:44px;font-size:16px}
.tab[aria-selected="true"]{background:var(--braun);color:#fff;border-color:var(--braun)}
.schmal{max-width:640px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;font-size:14px;color:var(--braun-hell)}
.kpi b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:var(--braun);line-height:1.1}
.verteilung{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:14px;line-height:1.9}
.werkzeug{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.werkzeug input[type=search]{flex:1 1 260px}
.werkzeug label{display:flex;gap:8px;align-items:center;margin:0;font-weight:400;font-size:15px}
.werkzeug input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--braun)}
.tabelle{overflow-x:auto;background:#fff;border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--beige);text-align:left;white-space:nowrap;vertical-align:top}
th{background:var(--creme);font-weight:700}
td.code a{font-family:'Courier New',monospace;font-weight:700;color:var(--braun)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin:1px 2px 1px 0}
.ja{background:#EEF7D4}.nein{background:var(--creme);color:var(--braun-hell)}.mehr{background:#FBEDE8;color:#8A2A12}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><img src="img/levita-bildmarke.png" alt="LeVita"><button class="leise" id="abmelden" hidden>Abmelden</button></div></header>
<main class="wrap">
<h1>Glücksrad – Empfang</h1>
<p class="sub">Glücksrad Herbst 2026 · einlösbar bis 31.01.2027</p>

<section class="karte schmal" id="login" hidden>
  <p style="margin:0">Bitte mit deinem Trainer-Zugang anmelden (wie im Trainer-Dashboard).</p>
  <div><label for="mail">E-Mail</label><input id="mail" type="email" autocomplete="username"></div>
  <div><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="primaer" id="loginBtn">Anmelden</button>
  <div class="meldung warn" id="loginFehler" hidden></div>
</section>

<section id="arbeit" hidden>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabBtnE" aria-selected="true" aria-controls="tabE">Einlösen</button>
    <button class="tab" role="tab" id="tabBtnL" aria-selected="false" aria-controls="tabL">Teilnehmer</button>
  </div>
  <div id="tabE" class="schmal" role="tabpanel">
    <div class="karte">
      <div><label for="code">Gutscheincode</label>
        <div class="zeile"><input id="code" class="code" placeholder="LV-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="14"><button class="sekundaer" id="pruefenBtn">Prüfen</button></div>
      </div>
      <div class="meldung" id="ergebnis" hidden aria-live="polite"></div>
      <button class="primaer" id="einloesenBtn" hidden>Jetzt als eingelöst markieren</button>
    </div>
    <p class="sub" style="font-size:15px">Bitte vor dem Einlösen den Namen mit der Person abgleichen – der Gutschein ist persönlich.</p>
  </div>
  <div id="tabL" role="tabpanel" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="verteilung" id="verteilung"></div>
    <div class="werkzeug">
      <input type="search" id="suche" placeholder="Suche: Name, E-Mail oder Code" aria-label="Teilnehmer durchsuchen">
      <label><input type="checkbox" id="nurMehrfach"> nur Mehrfachteilnahmen</label>
      <label><input type="checkbox" id="mitIntern"> interne Tests zeigen</label>
      <button class="sekundaer" id="neuLaden">Aktualisieren</button>
      <button class="primaer" id="csvBtn">Als CSV laden</button>
    </div>
    <div class="tabelle">
      <table>
        <thead><tr><th>Datum</th><th>Name</th><th>E-Mail</th><th>Gewinn</th><th>Code</th><th>Eingelöst</th><th>Newsletter</th><th>Quelle</th><th>Hinweis</th></tr></thead>
        <tbody id="liste"></tbody>
      </table>
    </div>
    <p class="sub" id="stand" style="font-size:14px;margin-top:10px"></p>
  </div>
</section>
</main>

<script src="/assets/supabase-js@2.js"></script>
<script>
/* LeVita Empfang · Gutschein einlösen · 1.3.0 · 24.10.2026 (Reiter Teilnehmer)
   Zugriff nur für Konten in trainer_roles (is_trainer()); die RPCs prüfen das in der Datenbank. */
(function () {
  var URL_ = 'https://koctweetotpqaazeicwj.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvY3R3ZWV0b3RwcWFhemVpY3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODQ3NzMsImV4cCI6MjA5NDk2MDc3M30.OS4WUR-q2rc82yxs_HkwlCzr9gDG8tBL0gIlwdUoyc0';
  var GEWINNE = { velusjet: '1 Anwendung VELUS JET', milon: '1 Monat milon-Training', vitalpaket: 'Vital-Paket',
    kompression: '1 Anwendung Venen Engel oder REBOOTS', personaltraining: '1 Personaltraining',
    manuelle_therapie: '1 manuelle Therapie', kurswoche: '1 Kurswoche', five: '1 Monat five' };
  var sb = window.supabase.createClient(URL_, KEY);
  var $ = function (id) { return document.getElementById(id); };
  var aktuell = null;

  function zeige(eingeloggt) { $('login').hidden = eingeloggt; $('arbeit').hidden = !eingeloggt; $('abmelden').hidden = !eingeloggt; if (eingeloggt) $('code').focus(); }
  function datum(s) { return s ? new Date(s).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : ''; }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ergebnis(klasse, html) { var e = $('ergebnis'); e.className = 'meldung ' + klasse; e.innerHTML = html; e.hidden = false; }
  function normCode(v) {
    var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.indexOf('LV') === 0) s = s.slice(2);
    return s.length === 8 ? 'LV-' + s.slice(0, 4) + '-' + s.slice(4) : null;
  }

  sb.auth.getSession().then(function (r) { zeige(!!(r.data && r.data.session)); });

  $('loginBtn').addEventListener('click', async function () {
    $('loginFehler').hidden = true; this.disabled = true;
    var r = await sb.auth.signInWithPassword({ email: $('mail').value.trim(), password: $('pw').value });
    this.disabled = false;
    if (r.error) { $('loginFehler').textContent = 'Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.'; $('loginFehler').hidden = false; return; }
    $('pw').value = ''; zeige(true);
  });
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });
  $('abmelden').addEventListener('click', async function () { await sb.auth.signOut(); aktuell = null; daten = null; reiter(false); $('ergebnis').hidden = true; $('einloesenBtn').hidden = true; zeige(false); });

  $('pruefenBtn').addEventListener('click', async function () {
    $('einloesenBtn').hidden = true; aktuell = null;
    var code = normCode($('code').value);
    if (!code) return ergebnis('warn', 'Der Code hat das Format <strong>LV-XXXX-XXXX</strong>. Bitte noch einmal prüfen.');
    $('code').value = code; this.disabled = true;
    var r = await sb.rpc('gewinnspiel_code_pruefen', { p_code: code });
    this.disabled = false;
    if (r.error) return ergebnis('warn', 'Abfrage fehlgeschlagen: ' + esc(r.error.message));
    var t = (r.data || [])[0];
    if (!t) return ergebnis('warn', 'Code <strong>' + esc(code) + '</strong> nicht gefunden. Bitte Schreibweise prüfen. Falls du sicher bist: Ist dein Konto als Trainer freigeschaltet?');
    var kopf = '<div class="gewinn">' + esc(GEWINNE[t.gewinn_key] || t.gewinn_key) + '</div><dl style="margin-top:10px"><dt>Name</dt><dd>' + esc(t.vorname) + ' ' + esc(t.nachname) + '</dd><dt>Teilgenommen</dt><dd>' + datum(t.teilgenommen_am) + '</dd>';
    if (t.eingeloest_am) return ergebnis('warn', kopf + '<dt>Status</dt><dd>Bereits eingelöst am ' + datum(t.eingeloest_am) + '</dd></dl>');
    if (Date.now() >= Date.parse('2027-01-31T23:00:00Z')) return ergebnis('warn', kopf + '<dt>Status</dt><dd>Einlösefrist abgelaufen (31.01.2027)</dd></dl>');
    aktuell = code;
    var weitere = t.weitere_teilnahmen || 0, weitereEin = t.weitere_eingeloest || 0;
    var btn = $('einloesenBtn');
    var regel = 'Laut Teilnahmebedingungen gilt bei Mehrfachteilnahme nur der zuerst erhaltene Gutschein – auch bei verschiedenen E-Mail-Adressen.';
    if (t.ist_erster === false) {
      var erster = esc(GEWINNE[t.erster_gewinn_key] || t.erster_gewinn_key) + ' vom ' + datum(t.erster_am) +
        (t.erster_eingeloest_am ? ' (bereits eingelöst am ' + datum(t.erster_eingeloest_am) + ')' : ' (noch nicht eingelöst)');
      ergebnis('warn', kopf + '<dt>Status</dt><dd>Nicht der erste Gutschein dieser Person</dd></dl>' +
        '<p style="margin:12px 0 0"><strong>Achtung:</strong> Unter diesem Namen gibt es einen früheren Gutschein: <strong>' + erster + '</strong>. ' + regel +
        ' Diesen Code bitte nicht einlösen – außer es ist sicher eine andere Person mit gleichem Namen.</p>');
      btn.textContent = 'Trotzdem einlösen (andere Person)';
    } else if (weitereEin > 0) {
      ergebnis('warn', kopf + '<dt>Status</dt><dd>Gültig, noch nicht eingelöst</dd></dl>' +
        '<p style="margin:12px 0 0"><strong>Achtung:</strong> Für diesen Namen wurde bereits ein späterer Gutschein eingelöst. ' + regel +
        ' Nur einlösen, wenn es sicher eine andere Person mit gleichem Namen ist.</p>');
      btn.textContent = 'Trotzdem einlösen (andere Person)';
    } else if (weitere > 0) {
      ergebnis('info', kopf + '<dt>Status</dt><dd>Gültig – das ist der erste Gutschein dieser Person</dd></dl>' +
        '<p style="margin:12px 0 0"><strong>Hinweis:</strong> Unter diesem Namen gibt es ' + weitere + ' weitere Teilnahme' + (weitere > 1 ? 'n' : '') +
        '. Diese Gutscheine sind ungültig.</p>');
      btn.textContent = 'Jetzt als eingelöst markieren';
    } else {
      ergebnis('info', kopf + '<dt>Status</dt><dd>Gültig, noch nicht eingelöst</dd></dl>');
      btn.textContent = 'Jetzt als eingelöst markieren';
    }
    btn.hidden = false;
  });
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('pruefenBtn').click(); });

  $('einloesenBtn').addEventListener('click', async function () {
    if (!aktuell) return; this.disabled = true;
    var r = await sb.rpc('gewinnspiel_einloesen', { p_code: aktuell });
    this.disabled = false;
    if (r.error) return ergebnis('warn', 'Einlösen fehlgeschlagen: ' + esc(r.error.message));
    var t = (r.data || [])[0] || {};
    this.hidden = true;
    if (t.ok) {
      ergebnis('gut', '<div class="gewinn">Eingelöst ✓</div><dl style="margin-top:10px"><dt>Gewinn</dt><dd>' + esc(GEWINNE[t.gewinn_key] || t.gewinn_key) + '</dd><dt>Name</dt><dd>' + esc(t.vorname) + ' ' + esc(t.nachname) + '</dd><dt>Zeitpunkt</dt><dd>' + datum(t.eingeloest_am) + '</dd></dl>');
      aktuell = null; $('code').value = ''; $('code').focus();
    } else {
      ergebnis('warn', esc(t.meldung || 'Nicht eingelöst.'));
    }
  });

  // ── Reiter ────────────────────────────────────────────────────────
  function reiter(liste) {
    $('tabE').hidden = liste; $('tabL').hidden = !liste;
    $('tabBtnE').setAttribute('aria-selected', String(!liste)); $('tabBtnL').setAttribute('aria-selected', String(liste));
    if (liste && !daten) laden(); else if (!liste) $('code').focus();
  }
  $('tabBtnE').addEventListener('click', function () { reiter(false); });
  $('tabBtnL').addEventListener('click', function () { reiter(true); });

  // ── Teilnehmerliste ───────────────────────────────────────────────
  var daten = null;
  var KURZ = { velusjet: 'VELUS JET', milon: 'milon 1 Monat', vitalpaket: 'Vital-Paket', kompression: 'Venen Engel/REBOOTS',
    personaltraining: 'Personaltraining', manuelle_therapie: 'Manuelle Therapie', kurswoche: 'Kurswoche', five: 'five 1 Monat' };
  function tag(s) { return s ? new Date(s).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : ''; }

  async function laden() {
    $('stand').textContent = 'Lade …';
    var r = await sb.rpc('gewinnspiel_teilnehmer');
    if (r.error) { $('stand').textContent = 'Laden fehlgeschlagen: ' + r.error.message; return; }
    daten = r.data || [];
    $('stand').textContent = 'Stand: ' + new Date().toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
    zeichne();
  }

  function gefiltert() {
    var q = $('suche').value.trim().toLowerCase();
    return (daten || []).filter(function (t) {
      if (!$('mitIntern').checked && t.is_internal) return false;
      if ($('nurMehrfach').checked && !(t.teilnahmen_gleicher_name > 1)) return false;
      if (!q) return true;
      return [t.vorname + ' ' + t.nachname, t.email, t.gutschein_code].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }

  function zeichne() {
    var basis = (daten || []).filter(function (t) { return $('mitIntern').checked || !t.is_internal; });
    var personen = basis.filter(function (t) { return t.ist_erster; }).length;
    var eingeloest = basis.filter(function (t) { return t.eingeloest_am; }).length;
    var nlJa = basis.filter(function (t) { return t.newsletter_bestaetigt_am; }).length;
    var nlOffen = basis.filter(function (t) { return t.newsletter && !t.newsletter_bestaetigt_am; }).length;
    var mehr = basis.filter(function (t) { return !t.ist_erster; }).length;
    $('kpis').innerHTML =
      '<div class="kpi"><b>' + basis.length + '</b>Teilnahmen</div>' +
      '<div class="kpi"><b>' + personen + '</b>Personen (je Name)</div>' +
      '<div class="kpi"><b>' + eingeloest + '</b>eingelöst' + (basis.length ? ' (' + Math.round(100 * eingeloest / basis.length) + ' %)' : '') + '</div>' +
      '<div class="kpi"><b>' + nlJa + '</b>Newsletter bestätigt' + (nlOffen ? ' · ' + nlOffen + ' offen' : '') + '</div>' +
      '<div class="kpi"><b>' + mehr + '</b>Mehrfachteilnahmen</div>';
    var proGewinn = {}, proQuelle = {};
    basis.forEach(function (t) {
      proGewinn[t.gewinn_key] = (proGewinn[t.gewinn_key] || 0) + 1;
      var q = t.quelle || 'direkt'; proQuelle[q] = (proQuelle[q] || 0) + 1;
    });
    var chips = function (o, namen) { return Object.keys(o).sort(function (a, b) { return o[b] - o[a]; }).map(function (k) { return '<span class="chip nein">' + esc(namen ? (namen[k] || k) : k) + ': ' + o[k] + '</span>'; }).join(' '); };
    $('verteilung').innerHTML = '<strong>Gewinne:</strong> ' + (chips(proGewinn, KURZ) || '–') + '<br><strong>Quelle:</strong> ' + (chips(proQuelle) || '–');

    var zeilen = gefiltert();
    $('liste').innerHTML = zeilen.length ? zeilen.map(function (t) {
      var nl = t.newsletter_bestaetigt_am ? '<span class="chip ja">bestätigt</span>' : (t.newsletter ? '<span class="chip nein">gewünscht</span>' : '–');
      var hinweis = [];
      if (!t.ist_erster) hinweis.push('<span class="chip mehr">ungültig (Mehrfach)</span>');
      else if (t.teilnahmen_gleicher_name > 1) hinweis.push('<span class="chip ja">erster Gutschein</span>');
      if (t.mail_status === 'fehler') hinweis.push('<span class="chip mehr">Mail nicht zugestellt</span>');
      if (t.is_internal) hinweis.push('<span class="chip nein">intern</span>');
      var quelle = [t.quelle, t.anzeige].filter(Boolean).join(' · ');
      return '<tr><td>' + tag(t.teilgenommen_am) + '</td><td>' + esc(t.vorname + ' ' + t.nachname) + '</td><td>' + esc(t.email) + '</td><td>' + esc(KURZ[t.gewinn_key] || t.gewinn_key) +
        '</td><td class="code"><a href="#" data-code="' + esc(t.gutschein_code) + '">' + esc(t.gutschein_code) + '</a></td><td>' + (t.eingeloest_am ? '<span class="chip ja">' + tag(t.eingeloest_am) + '</span>' : '–') +
        '</td><td>' + nl + '</td><td>' + esc(quelle || 'direkt') + '</td><td>' + hinweis.join(' ') + '</td></tr>';
    }).join('') : '<tr><td colspan="9" style="color:var(--braun-hell)">Keine Teilnahmen für diese Auswahl.</td></tr>';
  }

  $('liste').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-code]'); if (!a) return;
    e.preventDefault(); reiter(false); $('code').value = a.getAttribute('data-code'); $('pruefenBtn').click();
  });
  ['suche', 'nurMehrfach', 'mitIntern'].forEach(function (id) { $(id).addEventListener('input', zeichne); $(id).addEventListener('change', zeichne); });
  $('neuLaden').addEventListener('click', laden);

  $('csvBtn').addEventListener('click', function () {
    var zeilen = gefiltert();
    var kopf = ['Datum', 'Vorname', 'Nachname', 'E-Mail', 'Gewinn', 'Code', 'Eingelöst am', 'Newsletter gewünscht', 'Newsletter bestätigt am', 'Quelle', 'Anzeige', 'Kampagne', 'Erster Gutschein', 'Teilnahmen gleicher Name', 'Intern'];
    var zelle = function (v) { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = [kopf.join(';')].concat(zeilen.map(function (t) {
      return [tag(t.teilgenommen_am), t.vorname, t.nachname, t.email, KURZ[t.gewinn_key] || t.gewinn_key, t.gutschein_code, tag(t.eingeloest_am),
        t.newsletter ? 'ja' : 'nein', tag(t.newsletter_bestaetigt_am), t.quelle, t.anzeige, t.kampagne, t.ist_erster ? 'ja' : 'nein', t.teilnahmen_gleicher_name, t.is_internal ? 'ja' : 'nein'].map(zelle).join(';');
    })).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
